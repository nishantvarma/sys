        blank = i => !lines[i]?.trim();
      let fenced = false;
      lines.forEach((line, i) => {
        if (/^(```|~~~)/.test(line)) fenced = !fenced;
        if (fenced) return;
        const atx = line.match(/^(#{1,6})\s+(.*?)[\s#]*$/);
        if (atx) found.set(i, [atx[1].length, atx[2]]);
        else if (
          /^(=+|-+)\s*$/.test(line) &&
          /^\S/.test(lines[i - 1] ?? '') &&
          blank(i - 2)
        )
          found.set(i - 1, [line[0] === '=' ? 1 : 2, lines[i - 1].trim(), 2]);
      });
      if (found.size || !bare) return found;
      const parts = lines.flatMap((line, i) =>
        /^\S/.test(line) &&
        blank(i - 1) &&
        (blank(i + 1) || /^\s/.test(lines[i + 1])) &&
        !/[.:;,!?]\s*$/.test(line)
          ? [[i, [1, line.trim()]]]
          : [],
      );
      return new Map(parts.length > 1 ? parts : []);
    }

    // how code is outlined, by the language a line is in: its section mark,
    // -- name -- in its own comment; its comments; the line that starts a
    // heading, and the one that signs it, its end; whether braces open and
    // close what a heading holds; the lines before a heading that lead into
    // it, a css rule's other selectors; and lines that say nothing an
    // outline needs, a tag closing a style or a script, and the doctype.
    // html has marks only
    const codes = {
      py: {
        mark: /^\s*# -- [a-z]+ --\s*$/,
        remark: /^\s*#/,
        head: /^\s*(@|(async\s+)?(def|class)\s)/,
        signed: /^\s*(async\s+)?(def|class)\s/,
      },
      js: {
        mark: /^\s*\/\/ -- [a-z]+ --\s*$/,
        remark: /^\s*(\/\/|\/\*)/,
        head: /^\s*(export\s+)?(async\s+)?function\b/,
        signed: /\{\s*$/,
        braced: true,
      },
      css: {
        mark: /^\s*\/\* -- [a-z]+ -- \*\/\s*$/,
        remark: /^\s*\/\*/,
        head: /\{\s*$/,
        signed: /\{\s*$/,
        braced: true,
        lead: /,\s*$/,
      },
      // <\! keeps the page's own parser out of an escaped script
      html: {
        mark: /^\s*<\!-- -- [a-z]+ -- -->\s*$/,
        remark: /^\s*<\!--/,
        lone: /^\s*(<\/(style|script)>|<\!doctype html>)\s*$/i,
      },
    };
    // the language each line is in: html's style element holds css and
    // its script element js, their tags html
    function spoken(lines, kind) {
      let inner = kind;
      return lines.map(line => {
        const tag = kind === 'html' && line.match(/<(\/?)(style|script)\b/);
        if (!tag) return inner;
        inner = tag[1] ? 'html' : { style: 'css', script: 'js' }[tag[2]];
        return 'html';
      });
    }
    // code's nodes: a heading holds what is indented under it, as python
    // nests it: a class or a def with its decorators and signature, drawn
    // as its code says it, a js function, a css rule, as written, less the
    // braces around what it holds. a section mark, shown by its name,
    // heads what follows at its indent, up to the next mark there; in html
    // every mark is at the top.
    // blank and comment lines wait for the code after them, and go where
    // it goes; a python line that continues another goes with that one.
    // the code before the first heading, a docstring and imports, is a
    // node of its own, its first line the heading
    function defs(lines, kind) {
      const more = kind === 'py' ? continued(lines) : [],
        language = spoken(lines, kind),
        root = { indent: -1, body: [] },
        path = [root];
      let waiting = [],
        last = root,
        head,
        signed;
      // its heading read to the end: what follows is under it, or after it.
      // the brace that opens it shows no more than the one that closes it.
      // python's is drawn as its code says it, its docstring the one at
      // line i, and its id the names down to it, Field.broken_constraint
      const headed = i => {
        const title = head.lines
          .map(line => line.slice(head.indent))
          .join('\n');
        head.heading = head.braced ? title.replace(/\s*\{$/, '') : title;
        if (kind === 'py') {
          const doc = docstring(lines, more, i, head.indent),
            [name, heading] = signature(title, doc),
            owner = path.findLast(node => node.id);
          if (name) {
            head.heading = heading;
            head.id = owner ? `${owner.id}.${name}` : name;
          }
        }
        path.push(head);
        head = undefined;
      };
      lines.forEach((line, i) => {
        const code = codes[language[i]];
        if (head && (more[i] || !signed)) {
          head.lines.push(line);
          signed ||= code.signed.test(line);
          return;
        }
        if (head) headed(i);
        if (code.lone?.test(line)) return;
        if (more[i]) return last.body.push(line);
        const mark = code.mark.test(line);
        if (!mark && (!line.trim() || code.remark.test(line)))
          return waiting.push(line);
        // a mark sits half a step above its indent, in html at the margin:
        // what follows there goes under it, and the next mark there closes it
        const indent = mark
          ? (kind === 'html' ? 0 : line.search(/\S/)) - 0.5
          : line.search(/\S/);
        // a brace at a heading's indent closes what it holds, unshown
        const top = path.at(-1),
          closing = /^\s*}/.test(line) && top.indent === indent;
        if (code.braced && top.lines && closing) {
          top.body.push(...waiting);
          waiting = [];
          path.pop();
          last = path.at(-1);
          return;
        }
        while (path.at(-1).indent >= indent) path.pop();
        last = path.at(-1);
        last.body.push(...waiting);
        waiting = [];
        if (mark) {
          const title = line.match(/-- ([a-z]+) --/)[1];
          const node = { indent, heading: title, edge: [], body: [] };
          last.body.push(node);
          path.push(node);
        } else if (code.head?.test(line)) {
          head = {
            indent,
            lines: [line],
            edge: [],
            body: [],
            braced: code.braced,
          };
          // a css rule's other selectors, before its {, head it too
          const led = () => last.body.at(-1);
          while (code.lead?.test(led()) && led().search(/\S/) === indent)
            head.lines.unshift(last.body.pop());
          signed = code.signed.test(line);
          last.body.push(head);
        } else last.body.push(line);
      });
      if (head) headed(lines.length);
      path.at(-1).body.push(...waiting);
      const first = root.body.findIndex(item => item.body),
        lead = root.body.slice(0, first),
        at = lead.findIndex(line => line.trim());
      if (first > 0 && at >= 0)
        root.body.splice(0, first, {
          heading: lead[at].trim(),
          edge: [],
          body: lead.slice(at + 1),
        });
      return addressed(root);
    }
    // which python lines continue the one before: inside a string or
    // brackets it left open, or after its backslash
    function continued(lines) {
      let quote = '',
        depth = 0,
        slash = false;
      return lines.map(line => {
        const more = Boolean(quote) || depth > 0 || slash;
        let i = 0;
        for (; i < line.length; i++) {
          const c = line[i];
          if (quote) {
            if (c === '\\') i++;
            else if (line.startsWith(quote, i)) {
              i += quote.length - 1;
              quote = '';
            }
          } else if (c === '#') break;
          else if (c === '"' || c === "'") {
            quote = line.startsWith(c.repeat(3), i) ? c.repeat(3) : c;
            i += quote.length - 1;
          } else if ('([{'.includes(c)) depth++;
          else if (')]}'.includes(c)) depth = Math.max(0, depth - 1);
        }
        // a string in one quote ends with its line
        if (quote.length === 1) quote = '';
        slash = i === line.length && line.endsWith('\\');
        return more;
      });
    }
    // python's text cut at each sep outside brackets and strings, its
    // quotes read as continued() reads them
    function split(text, sep) {
      const cuts = [-1];
      let depth = 0,
        quote = '';
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quote) {
          if (c === '\\') i++;
          else if (text.startsWith(quote, i)) {
            i += quote.length - 1;
            quote = '';
          }
        } else if (c === '"' || c === "'") {
          quote = text.startsWith(c.repeat(3), i) ? c.repeat(3) : c;
          i += quote.length - 1;
        } else if (!depth && c === sep) cuts.push(i);
        else if ('([{'.includes(c)) depth++;
        else if (')]}'.includes(c)) depth--;
      }
      return cuts.map((cut, n) => text.slice(cut + 1, cuts[n + 1]));
    }
    // what a bracket holds as one line: its items, cut at its commas, each
    // with its spaces collapsed
    const members = text =>
      split(text, ',')
        .map(item => item.replace(/\s+/g, ' ').trim())
        .filter(Boolean);
    // python's heading as its code says it, @property def parts(): each
    // decorator inline, then def or class faint, the name bold, then a
    // def's params less self and cls and their annotations, a default over
    // 10 characters =…, or a class's bases. hovered, the signature as
    // written and the docstring. none if it names no def or class
    function signature(title, doc) {
      const code = title.replace(
          /("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|#.*/g,
          (all, string) => string ?? '',
        ),
        at = code.search(/^(async\s+)?(def|class)\s/m),
        [sign, kind, name] =
          code.slice(at).match(/^((?:async\s+)?def|class)\s+([^\s(:[]+)/) ??
          [];
      if (at < 0 || !name) return [];
      const rest = code.slice(at + sign.length).trim(),
        inner = rest[0] === '(' ? split(rest.slice(1), ')')[0] : '';
      let star = false;
      const params = members(inner).flatMap(item => {
        const [named, ...value] = split(item, '='),
          param = split(named, ':')[0].trim(),
          given = value.join('=').trim();
        star ||= param.startsWith('*');
        if (param === '/' || (!star && /^(self|cls)$/.test(param))) return [];
        return [given ? `${param}=${given.length > 10 ? '…' : given}` : param];
      });
      const decorators = code
          .slice(0, at)
          .split(/\n(?=@)/)
          .map(deco =>
            deco
              .trim()
              .replace(
                /\(([^]*)\)$/,
                (all, args) => `(${members(args).join(', ')})`,
              ),
          )
          .filter(Boolean),
        bases = members(inner).join(', '),
        after =
          kind === 'class' ? bases && `(${bases})` : `(${params.join(', ')})`,
        faint = text => `<span class="kwd">${esc(text)} </span>`;
      return [
        name,
        el('span', {
          title: doc ? `${title}\n\n${doc.slice(0, 500)}` : title,
          innerHTML:
            [...decorators, kind.replace(/\s+/g, ' ')].map(faint).join('') +
            `<b>${esc(name)}</b>${esc(after)}`,
        }),
      ];
    }
    // a python def's docstring: the string its body opens with, at line i
    // or after its blank and comment lines, under its indent; the quotes
    // and the indent let go
    function docstring(lines, more, i, indent) {
      while (/^\s*(#.*)?$/.test(lines[i] ?? '.')) i++;
      if (!(lines[i]?.search(/\S/) > indent)) return '';
      let end = i + 1;
      while (more[end]) end++;
      const quoted = dedent(lines.slice(i, end).join('\n')).trim();
      return quoted.match(/^[rRuU]?('''|"""|'|")([^]*)\1$/)?.[2].trim() ?? '';
    }

    // -- epub --
    // an epub is a zip of xhtml. the zip's central directory, at its end,
    // locates every entry, and DecompressionStream inflates one when it is
    // read
    async function unzip(file) {
      const buffer = await file.arrayBuffer(),
        data = new DataView(buffer);
      const u16 = i => data.getUint16(i, true),
        u32 = i => data.getUint32(i, true);
      const utf8 = new TextDecoder(),
        index = new Map();
      let end = buffer.byteLength - 22;
      while (u32(end) !== 0x06054b50) end--;
      for (
        let i = u32(end + 16), n = u16(end + 10);
        n--;
        i += 46 + u16(i + 28) + u16(i + 30) + u16(i + 32)
      ) {
        const head = u32(i + 42);
        const start = head + 30 + u16(head + 26) + u16(head + 28);
        index.set(utf8.decode(new Uint8Array(buffer, i + 46, u16(i + 28))), {
          start,
          end: start + u32(i + 20),
          deflated: u16(i + 10) === 8,
        });
      }
      return async name => {
        const member = index.get(name);
        if (!member) return;
        const bytes = file.slice(member.start, member.end);
        return member.deflated
          ? new Response(
              bytes
                .stream()
                .pipeThrough(new DecompressionStream('deflate-raw')),
            ).blob()
          : bytes;
      };
    }

    // one book is open at a time, so opening one lets go of the urls the last
    // made
    const bookurls = [];

    // the package's manifest types every entry, and its spine orders the
    // chapters
    async function epub(src) {
      bookurls.splice(0).forEach(u => URL.revokeObjectURL(u));
      const zip = await unzip(await (await read(src)).blob());
      const xml = async (path, type) =>
        new DOMParser().parseFromString(await (await zip(path)).text(), type);
      const url = (href, base) => new URL(href, `epub:/${base}`);
      const resolve = (href, base) =>
        decodeURIComponent(url(href, base).pathname.slice(1));
      const opfpath = (await xml('META-INF/container.xml', 'text/xml'))
        .querySelector('rootfile')
        .getAttribute('full-path');
      const opf = await xml(opfpath, 'text/xml');
      const manifest = new Map(
        [...opf.querySelectorAll('manifest > item')].map(item => [
          item.id,
          {
            path: resolve(item.getAttribute('href'), opfpath),
            type: item.getAttribute('media-type'),
          },
        ]),
      );
      const types = new Map([...manifest.values()].map(m => [m.path, m.type]));
      // a blob out of the zip has no type, and an image or a font needs one
      const urlof = async path => {
        const blob = await zip(path);
        if (!blob) return '';
        const typed = blob.slice(0, blob.size, types.get(path));
        bookurls.push(URL.createObjectURL(typed));
        return bookurls.at(-1);
      };
      const style = async path => {
        const css = await (await zip(path)).text();
        const ref = /url\(\s*['"]?(.+?)['"]?\s*\)/g;
        const urls = new Map(
          await Promise.all(
            [...css.matchAll(ref)].map(async ([, href]) => [
              href,
              await urlof(resolve(href, path)),
            ]),
          ),
        );
        const linked = css.replace(
          ref,
          (_, href) => `url("${urls.get(href)}")`,
        );
        return new CSSStyleSheet().replace(`@layer book { ${linked} }`);
      };
      const host = el('article');
      const shadow = host.attachShadow({ mode: 'open' });
      // a heading Book is #book too, in an outline still shown while this
      // one is drawn
      shadow.append(
        document.querySelector('template#book').content.cloneNode(true),
      );
      shadow.adoptedStyleSheets = await Promise.all(
        [...types]
          .filter(([, type]) => type === 'text/css')
          .map(([path]) => style(path)),
      );
      for (const ref of opf.querySelectorAll('spine > itemref')) {
        const { path } = manifest.get(ref.getAttribute('idref'));
        const doc = await xml(path, 'application/xhtml+xml');
        for (const e of doc.querySelectorAll('[src], image')) {
          e.dataset.src = resolve(
            e.getAttribute('src') ??
              e.getAttribute('xlink:href') ??
              e.getAttribute('href'),
            path,
          );
          for (const name of ['src', 'href', 'xlink:href'])
            e.removeAttribute(name);
        }
        // chapters share one root, so an id is made unique by its chapter
        for (const e of doc.querySelectorAll('[id]')) e.id = `${path}#${e.id}`;
        for (const a of doc.querySelectorAll('a[href]')) {
          const to = url(a.getAttribute('href'), path);
          if (to.protocol === 'epub:')
            a.dataset.to = decodeURIComponent(to.pathname.slice(1) + to.hash);
          else a.target = '_blank';
        }
        const section = el('section', { id: path });
        section.append(...doc.body.childNodes);
        // a book can hold thousands of images, so a chapter inflates its own
        // only when the browser is about to paint it
        const change = 'contentvisibilityautostatechange';
        section.addEventListener(change, async function inflate({ skipped }) {
          if (skipped) return;
          section.removeEventListener(change, inflate);
          for (const e of section.querySelectorAll('[data-src]'))
            e.setAttribute(
              e.localName === 'image' ? 'href' : 'src',
              await urlof(e.dataset.src),
            );
        });
        shadow.append(section);
      }
      // a link inside the book must not touch location.hash, which names what
      // is open
      shadow.addEventListener('click', e => {
        const to = e.target.closest('a[data-to]')?.dataset.to;
        if (!to) return;
        e.preventDefault();
        shadow.getElementById(to)?.scrollIntoView();
      });
      return host;
    }

    // -- pdf --
    // chrome on a laptop draws a pdf itself, so a frame of its url shows it.
    // chrome on android has no viewer to put in a frame: it downloads the
    // file into drive. there pdf.js draws it, in a sandboxed frame handed the
    // bytes and nothing else
    const pdfjs = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289';
    async function pdf(src) {
      // the viewer reads options from the fragment. fit to width with the
      // sidebar shut, little of its grey shows, which dark inverts to light
      if (navigator.pdfViewerEnabled)
        return el('iframe', {
          src: `${src}#view=FitH&navpanes=0`,
          className: 'pdf',
        });
      const buffer = await (await read(src)).arrayBuffer();
      // no background: this page's paper lies between the pages, and an
      // outline keeps a white page off white paper
      const view = el('iframe', {
        className: 'pdf',
        sandbox: 'allow-scripts',
        srcdoc: `<!doctype html>
      <meta name="color-scheme" content="light dark">
      <style>
        body { display: grid; gap: 8px; margin: 0; padding: 8px;
               font: 1rem system-ui; }
        canvas { inline-size: 100%; background: #fff;
                 outline: 1px solid #8886; }
      <\/style>
      <script>
        onmessage = async ({ data }) => {
          const lib = await import('${pdfjs}/pdf.min.mjs').catch(() => null);
          if (!lib)
            return document.body.append('pdf.js did not load from ${pdfjs}');
          lib.GlobalWorkerOptions.workerSrc = '${pdfjs}/pdf.worker.min.mjs';
          const doc = await lib.getDocument({ data: data.buffer }).promise;
          const unit = page => page.getViewport({ scale: 1 });
          // in device pixels, at the width the page is shown
          async function draw(canvas) {
            const page = await doc.getPage(canvas.n);
            const { width, height } = unit(page);
            const viewport = page.getViewport({
              scale: (canvas.clientWidth * devicePixelRatio) / width,
            });
            canvas.style.aspectRatio = width / height;
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.task = page.render({ canvas, viewport });
            await canvas.task.promise.catch(e => {
              if (e.name !== 'RenderingCancelledException') throw e;
            });
          }
          // a drawn page holds megabytes, so a page is drawn near the screen
          // and let go far from it
          const near = new IntersectionObserver(
            entries => {
              for (const { target, isIntersecting } of entries) {
                target.task?.cancel();
                if (isIntersecting) draw(target);
                else target.width = target.height = 0;
              }
            },
            { rootMargin: '200% 0px' },
          );
          // until it is drawn, a page takes the first one's shape
          const { width, height } = unit(await doc.getPage(1));
          for (let n = 1; n <= doc.numPages; n++) {
            const canvas = document.createElement('canvas');
            canvas.n = n;
            canvas.style.aspectRatio = width / height;
            near.observe(document.body.appendChild(canvas));
          }
        };
      <\/script>`,
        onload: () =>
          view.contentWindow.postMessage({ buffer }, '*', [buffer]),
      });
      return view;
    }

    // -- djvu --
    // no browser reads djvu. djvu.js does, in a sandboxed frame handed the
    // bytes and nothing else
    const djvujs = 'https://djvu.js.org/assets/dist';
    async function djvu(src, path) {
      const buffer = await (await read(src)).arrayBuffer();
      const frame = el('iframe', {
        sandbox: 'allow-scripts',
        srcdoc: `<!doctype html>
      <meta name="color-scheme" content="light dark">
      <style>
        html, body { block-size: 100%; margin: 0; font: 1rem system-ui; }
      <\/style>
      <script src="${djvujs}/djvu.js"><\/script>
      <script src="${djvujs}/djvu_viewer.js"><\/script>
      <script>
        onmessage = ({ data }) => {
          if (!self.DjVu)
            return document.body.append('djvu.js did not load from ${djvujs}');
          const viewer = new DjVu.Viewer();
          viewer.render(document.body);
          viewer.loadDocument(data.buffer, data.name, {
            viewMode: 'continuous',
            uiOptions: { hideOpenAndCloseButtons: true, hideSaveButton: true,
                         hideFullPageSwitch: true },
          });
        };
      <\/script>`,
        onload: () =>
          frame.contentWindow.postMessage(
            { buffer, name: basename(path) },
            '*',
            [buffer],
          ),
      });
      return frame;
    }

    // -- start --
    // the root is the library's own listing, read before anything is drawn,
    // so a root chosen above the last can move what was kept
    async function load() {
      root = file('', true);
      await listing(root);
    }

    async function begin() {
      document.body.classList.add('ready');
      // a reload with a file open comes back to the place it was opened in,
      // the tree as it was
      const place = stored('shelf:place') ?? '',
        p = clean(decodeURIComponent(location.hash.slice(1)));
      await (place && p.startsWith(`${place}/`)
        ? enter(file(place, true)).catch(() => enter(root))
        : enter(root));
      addEventListener('keydown', e => {
        if (dialog.open || e.ctrlKey || e.metaKey || e.altKey) return;
        if (help.open && e.key !== '?') return;
        const act = bound[spelt[e.key] ?? e.key];
        if (!act) return;
        e.preventDefault();
        act(e);
      });
      addEventListener('hashchange', route);
      route();
    }

    // opened as a file, the root is a folder chosen in the browser's picker.
    // its handle outlives a reload only in indexeddb, and the browser may ask
    // again before the folder can be read
    async function choose() {
      const request = r =>
        new Promise((ok, fail) =>
          Object.assign(r, {
            onsuccess: () => ok(r.result),
            onerror: () => fail(r.error),
          }),
        );
      const open = name =>
        request(
          Object.assign(indexedDB.open(name), {
            onupgradeneeded: ({ target }) =>
              target.result.createObjectStore('folders'),
          }),
        );
      const db = await open('shelf');
      const store = mode =>
        db.transaction('folders', mode).objectStore('folders');
      // as path.html, this page kept the folder in indexeddb pathreader.
      // deleting that waits for any old page still open, so nothing here
      // waits on it
      if ((await indexedDB.databases()).some(d => d.name === 'pathreader')) {
        const was = await open('pathreader');
        const chosen = await request(
          was.transaction('folders').objectStore('folders').get('root'),
        );
        was.close();
        indexedDB.deleteDatabase('pathreader');
        if (chosen) await request(store('readwrite').put(chosen, 'root'));
      }
      const last = await request(store('readonly').get('root'));
      const start = async dir => {
        library = disk(dir);
        await load();
        const up = last && (await dir.resolve(last).catch(() => null));
        if (up?.length) rebase(up.join('/'));
        await request(store('readwrite').put(dir, 'root'));
        await begin();
      };
      const button = main.querySelector('button');
      let saved = last;
      if ((await saved?.queryPermission()) === 'granted') {
        try {
          return await start(saved);
        } catch (error) {
          output.value = error.message;
          saved = null;
        }
      }
      if (saved) button.textContent = `Open ${saved.name}/`;
      button.hidden = false;
      button.onclick = async () => {
        try {
          await start(
            (await saved?.requestPermission()) === 'granted'
              ? saved
              : await showDirectoryPicker({ id: 'shelf' }),
          );
        } catch (error) {
          output.value = error.message;
          saved = null;
          button.textContent = 'Choose folder';
        }
      };
    }

    if (location.protocol === 'file:') await choose();
    else {
      library = web(new URL('.', location.href));
      await load().then(
        begin,
        error =>
          (output.value = `Could not read the library: ${error.message}`),
      );
    }
  </script>
</html>
