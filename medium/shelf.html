<!doctype html>
<!-- -- head -- -->
<!-- a shelf: the folder beside this page, a tree that unfolds in place. the
     data is not in this file: it is the folders, their files, and the
     path.md in a folder that has one. edit those, and add rules under
     local. edit nothing else: a change to style or engine is a change to
     the skeleton, ~/src/sys/medium/shelf.html.

     tree     the pane: names only, a folder medium, a file regular. a
              folder or a stage unfolds under its own row, its rows hung
              on a thin guide, and keeps the cursor by the name under it
     place    the folder at the top of the tree
     folder   its stages first if it holds a path.md, then its files
     kind     a file's extension, drawn as a tag right after its name, which
              shows without it: html py md js pdf each in its hue, any other
              muted. a leaf, with none, and a folder show none. a long name
              is cut before its tag
     subject  a folder that holds a path.md, its ticks beside it as t/n. its
              # heading is the title, atop the tree while it is the place,
              and the lines under it the note
     stage    a ## heading. its rows are its entries
     entry    a list item: `path` — **title** — note. a path runs from the
              subject's folder, and ../ reaches a sibling. the tick is kept
              under the title, else under the first path
     tick     a reading mark. an entry keeps one in a column, path.md's
              number in it; any other file shows a ✓ at its edge, and only
              once ticked. a path's tick is one wherever it is listed. x
              ticks the row under the cursor; ✓ in an open file's bar, the
              file open
     group    a line all in **bold** heads the entries below it
     block    lines indented four spaces, or a table, kept as written
     preview  beside the tree, the file under the cursor, or what an entry
              names: a file its page, a subject its stages and how much is
              ticked, any other folder its card. a stage shows nothing
              there. opening a file makes its preview the viewer. under
              50rem, a phone or a narrow window, no preview fits
     card     a folder's count of files, its title, and its tree, as the
              tree draws it. a folder a path.md names is reading: a line
              under its title starts it at its first file, skipping names
              that start with a dot, or resumes the file left part way.
              two levels show at first: a folder in a folder starts
              folded, as does one of over 30 rows, its count beside it
              while folded, or one whose name starts with a dot. served by
              quark.mjs, each row two levels down also shows its weight:
              its bytes as a bar against its heaviest sibling's, its size
              and its entries, drawn when du has answered. if it answers
              within 400ms, a folder instead opens if it holds a fifth of
              the one it is in, to three levels. its keys are an
              outline's; a file in it opens in the tree, by l, enter or a
              tap
     outline  a text with headings, previewed or open: a bullet a heading,
              folded at first so the headings show, a tap to fold or unfold
              one, a folded one's bullet ringed. md heads with #, or a line
              underlined in = or -; a leaf with those, or with bare lines
              alone between blanks; python with its classes and defs, as it
              nests them, each headed as its code says it, @property def
              parts(): decorators and def faint, the name bold, self and cls
              dropped, a default over 10 characters =…, its hover the
              signature as written and the docstring, its id its qualified
              name, Field.broken_constraint; a # -- name -- mark heading the
              defs after it, and the code before the first def one node, its
              first line the heading. a leaf that
              is a script, #! first, stays text. open, the file's bar folds
              the whole: expand all, collapse all. on a phone a block keeps
              its columns, and scrolls across. a .diff or .patch heads a file
              by path, its status, +n −m at the edge, its hunks under it,
              adds and dels tinted. each heading is a page's node, its id
              the path of the headings down to it, design/architecture; a
              duplicate gets -2
     bar      a file open has one bar, nothing between it and the text:
              where the file is, then its tools, ghost icons, each named
              with its key in its title: expand all (e) and collapse all
              (c) while an outline shows, page | source, previous (p),
              next (n), tick (x), full width (f) where a preview fits,
              pressed while on, close (esc). ? shows each icon beside
              its key
     source   js and css open as an outline too, and a page opens as the
              page: u, or page | source in its bar, flips it to its
              outline and back. each section mark, -- name -- in the
              file's own comment, heads what follows it, shown by its name;
              under a mark, css by its rules and js by its functions, their
              braces unshown, and a page's style and script elements read
              as css and js, their closing tags and the doctype unshown.
              with no marks, rules or functions alone, else plain text

     hash     the place, or the file open, as a path from here:
              shelf.html#math/calc
     keys              Folder, stage        File, entry
              ↑ ↓ j k  Move only            Move; the preview shows it
              → l      Unfold, or step in   Open
              ← h      Fold, or go up and fold that; at the top, the
                       folder above. A file open closes
              enter    Unfold or fold       Open
              a tap    Unfold or fold       Open
              And x tick, n p next or previous file, / find, f full width,
              . show or hide names that start with a dot, shown at first,
              i flip a pdf between paper and dark, u a page and its
              source, v the nearest .git/changes.diff above the row under the
              cursor, or the file open, its keys in it, ? these keys, as does
              ? keys atop the tree, esc close
     view     tab hands the view the keys if it has its own; shift+tab,
              esc, or h at its first heading hand them back, as do a tap
              in the tree and a new hash. an outline's are a page's: j k
              move, l unfold or step in, h fold or go up and fold that,
              o z e c fold to the outline, all but around the cursor, all
              open, all shut, / find a heading. a page in a frame is handed
              the focus, and its own keys run, its ? too. a tap is in the
              pane it lands in, so on touch nothing stands in for tab
     kept     in this browser: ticks, the cursor in each folder and stage,
              the folders and stages left unfolded, whether names that
              start with a dot show, the place, so a reload with a file
              open comes back to it, and places in lectures, in
              localstorage under shelf:, and the chosen folder in indexeddb
              shelf. what this page kept as path.html, under pathreader,
              moves here once. choosing a folder that holds the last one
              moves what was kept under the last to the new
     serve    shelf/shelf [dir] [port] serves dir, the tablet's Data or
              else the current folder, at localhost:port, 8080 by default;
              or open this file and choose a folder
     tablet   shelf/bootstrap once in termux. then shelf/pull copies what
              $HOME/keep names from the laptop, and shelf/shelf serves it
              at localhost:8080, with ticks kept apart from the laptop's
     deploy   cp shelf.html ~/Data: the tablet's copy, which pull brings
     map      grep -n -- '-- [a-z]* --' shelf.html
     check    check shelf.html; node shelf/run.mjs [library] [page] -->
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shelf</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><rect x='2' y='2' width='12' height='12' fill='%231f4fd8'/></svg>"
  />

  <style>
    /* -- tokens -- */
    :root {
      color-scheme: light dark;
      --paper: light-dark(#ffffff, #0f0f0f);
      --panel: light-dark(#f4f4f3, #1a1a1a);
      --ink: light-dark(#0a0a0a, #f2f2f2);
      --muted: light-dark(#6b6b6b, #8f8f8f);
      --rule: light-dark(#e5e5e5, #262626);
      --accent: light-dark(#1f4fd8, #7b97ff);
      --sans: 'Ubuntu Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --serif: Charter, 'Bitstream Charter', Georgia, serif;
      --mono: 'Ubuntu Sans Mono', 'SF Mono', Menlo, Consolas, monospace;
      --row: 1.875rem;
      --html: light-dark(#c2410c, #fb923c);
      --py: light-dark(#2563eb, #7aa7ff);
      --md: light-dark(#0f766e, #5eead4);
      --js: light-dark(#a16207, #facc15);
      --pdf: light-dark(#b91c1c, #f87171);
    }
    @media (pointer: coarse) {
      :root {
        --row: 2.5rem;
      }
    }

    /* -- style -- */
    * {
      box-sizing: border-box;
    }
    body {
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      block-size: 100dvh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 0.9375rem/1.5 var(--sans);
    }
    body.ready {
      grid-template-columns: auto minmax(0, 1fr);
    }
    /* full width: the file alone, the tree hidden wherever it stood, beside
       the file or under it. .ready too, to outrank the tree's own display
       and the layouts below */
    body.ready.wide {
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
    }
    body.ready.wide main,
    body:not(.ready) aside {
      display: none;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    code {
      font: 0.8em var(--mono);
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    /* until a folder is chosen, or the server answers */
    .landing {
      padding: 5rem max(1.5rem, 50% - 21rem) 8rem;
    }
    .landing h1 {
      margin: 0 0 1.5rem;
      font-size: 2.75rem;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .landing p {
      max-inline-size: 36rem;
      color: var(--muted);
    }
    .landing button {
      padding: 0.5rem 1.25rem;
      border: 0;
      background: var(--accent);
      color: var(--paper);
    }
    output {
      color: var(--accent);
    }

    /* the tree keeps its scrollbar's room, shown or not: an unfold that
       runs it past its height moves no row's end */
    main {
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-gutter: stable;
    }
    body.ready main {
      display: flex;
      flex-direction: column;
      inline-size: 32rem;
      min-inline-size: 22rem;
      max-inline-size: 60vw;
      padding: 0 0.5rem;
      border-inline-end: 1px solid var(--rule);
      resize: horizontal;
    }
    header,
    footer {
      position: sticky;
      z-index: 1;
      padding: 0.625rem;
      background: var(--paper);
    }
    header {
      inset-block-start: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.25rem 1rem;
      padding-block-start: 1rem;
      border-block-end: 1px solid var(--ink);
    }
    header h1 {
      flex: 1;
      margin: 0;
      overflow: hidden;
      font-size: 1rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    header a {
      color: var(--muted);
    }
    header small {
      color: var(--muted);
      font: 0.6875rem var(--mono);
    }
    /* a subject's # title, the place's, on a line of its own */
    header p {
      flex-basis: 100%;
      margin: 0;
      font-size: 0.875rem;
    }
    /* the keys at a tap, atop the tree */
    header button {
      padding: 0.25rem 0.625rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--paper);
      font: 0.75rem var(--mono);
    }
    header button:hover {
      border-color: var(--muted);
    }
    header button {
      color: var(--muted);
    }
    /* the note of the row under the cursor */
    footer {
      inset-block-end: 0;
      max-block-size: 6rem;
      overflow: auto;
      border-block-start: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.8125rem;
    }
    footer p {
      margin: 0;
    }
    main ul {
      flex: 1;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    /* an unfolded folder or stage: its rows hang under its own, and so do a
       folder's in its tree on the right */
    main li > ul,
    .card details > div {
      margin-inline-start: 0.875rem;
      padding-inline-start: 0.375rem;
      border-inline-start: 1px solid var(--rule);
    }
    /* . hides a name that starts with a dot, and what is under it */
    .nodots .dot {
      display: none;
    }
    .row {
      display: grid;
      column-gap: 0.625rem;
      align-items: start;
      grid-template:
        'tick text side' 'tick where where'
        / 1.5rem minmax(0, 1fr) auto;
      min-block-size: var(--row);
      padding: 0.4375rem 0.625rem;
      scroll-margin-block: 4rem 3rem;
      cursor: pointer;
    }
    /* a pointer's hover tints a row; a tap leaves no tint behind it */
    @media (hover: hover) {
      .row:hover {
        background: color-mix(in oklab, var(--panel) 60%, transparent);
      }
    }
    .row:has(:checked) {
      color: var(--muted);
    }
    [aria-current] > .row {
      background: var(--panel);
      box-shadow: inset 3px 0 var(--accent);
    }
    .row.focus {
      background: color-mix(in oklab, var(--accent) 14%, transparent);
    }
    [aria-current] > .row :is(strong, a) {
      color: var(--accent);
    }
    .text {
      grid-area: text;
      margin: 0;
    }
    .row::after,
    .file small {
      grid-area: side;
      justify-self: end;
      color: var(--muted);
      font: 0.6875rem/1.9 var(--mono);
    }
    .row[data-count]::after {
      content: attr(data-count);
      font-weight: 400;
    }
    /* a folder on the right counts its rows only while it is folded */
    details[open] > .row::after {
      content: none;
    }
    .stage > .row {
      grid-template: 'text side' / minmax(0, 1fr) auto;
      padding-block: 0.75rem;
      border-block-start: 1px solid var(--rule);
      font-weight: 700;
    }
    .group,
    .kicker {
      color: var(--muted);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .group {
      margin: 1rem 0 0.25rem;
      padding-inline-start: 0.625rem;
    }
    .entry > .row::after {
      content: attr(data-type);
      font: 500 0.625rem/2 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .entry strong {
      display: block;
      font-weight: 500;
    }
    .note,
    .prose .text {
      display: block;
      color: var(--muted);
      font-size: 0.8125rem;
    }
    .prose > .row {
      grid-template: 'tick text' / 1.5rem minmax(0, 1fr);
      cursor: default;
    }
    pre.text {
      font: 0.6875rem/1.6 var(--mono);
      overflow-x: auto;
    }
    .where {
      grid-area: where;
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font: 0.6875rem/1.7 var(--mono);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .where code {
      font: inherit;
    }
    a[data-absent] {
      text-decoration: line-through;
    }
    .tick {
      grid-area: tick;
      position: relative;
      display: grid;
      place-content: center;
      inline-size: 1.5rem;
      aspect-ratio: 1;
      border: 1.5px solid var(--rule);
      border-radius: 50%;
      color: var(--muted);
      font: 600 0.625rem/1 var(--sans);
      font-variant-numeric: tabular-nums;
    }
    .tick:hover {
      border-color: var(--accent);
    }
    .tick:has(:checked) {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--paper);
    }
    .tick > input {
      position: absolute;
      inset: -1.5px;
      margin: 0;
      border-radius: 50%;
      appearance: none;
      cursor: pointer;
    }
    /* a file is its name, its kind right after it, and a ✓ at its edge once
       ticked: a tick column costs 1.5rem a row, which nested rows on a
       phone cannot spare. a long name is cut before its kind, so the kind
       shows; the side keeps the rest, its t/n or clock at the edge */
    .file > .row {
      grid-template:
        'text kind side tick'
        / minmax(0, max-content) auto 1fr auto;
      align-items: center;
      padding-block: 0.3125rem;
      font-size: 0.8125rem;
    }
    /* a row's weight, in a card: its bytes as a bar against its heaviest
       sibling's, then size and entries, drawn from data so find never
       reads them. a card's rows have no tick: it stands in its place */
    .wt {
      grid-area: tick;
      display: flex;
      gap: 0.5rem;
      padding-inline-start: 5.5rem;
      background: linear-gradient(
          90deg,
          var(--accent) var(--w),
          var(--panel) var(--w)
        )
        no-repeat 0 50% / 5rem 0.375rem;
      color: var(--muted);
      font: 0.6875rem/1.9 var(--mono);
    }
    .wt::before,
    .wt::after {
      text-align: end;
    }
    .wt::before {
      content: attr(data-size);
      min-inline-size: 4ch;
    }
    .wt::after {
      content: attr(data-entries);
      min-inline-size: 5ch;
    }
    .file > .row > .text {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .folder > .row > .text {
      color: var(--ink);
      font-weight: 500;
    }
    /* a file's kind, right after its name. drawn from data-kind, never a
       text node, so find and a tick still see the whole name */
    .kind {
      --hue: var(--muted);
      grid-area: kind;
      padding: 0.1875rem 0.3125rem;
      border-radius: 4px;
      background: color-mix(in oklab, var(--hue) 12%, transparent);
      color: var(--hue);
      font: 600 0.59375rem/1 var(--mono);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .kind::before {
      content: attr(data-kind);
    }
    .text > .ext {
      display: none;
    }
    .kind[data-kind='html'] {
      --hue: var(--html);
    }
    .kind[data-kind='py'] {
      --hue: var(--py);
    }
    .kind[data-kind='md'] {
      --hue: var(--md);
    }
    .kind[data-kind='js'] {
      --hue: var(--js);
    }
    .kind[data-kind='pdf'] {
      --hue: var(--pdf);
    }
    .file > .row > .tick {
      border: 0;
      background: none;
      color: var(--accent);
      font-size: 0.875rem;
    }
    .file > .row > .tick::before {
      content: '✓';
    }
    .file > .row > .tick:not(:has(:checked)) {
      display: none;
    }

    /* every view starts at the top, under the bar, --above it, at one place
       whatever its length: nothing here is centred top to bottom but a
       video's picture, in the middle of its stage. its text
       starts --inset from the left: a phone's margin, or side by side the
       tree's gutter */
    aside {
      --above: 2.5rem;
      --inset: max(1.5rem, 50% - 22rem);
      display: grid;
      grid-template: auto minmax(0, 1fr) / minmax(0, 1fr);
      container-type: inline-size;
    }
    /* the view keeps the row under the bar's, the bar there or not, and is
       no taller: a frame previewed is as tall as it is opened, and a long
       card scrolls. it keeps its scrollbar's room, shown or not: a fold
       that runs it past its height moves no text across */
    aside > :last-child {
      grid-row: 2;
      max-block-size: 100%;
      overflow: auto;
      scrollbar-gutter: stable;
    }
    /* a page's other view, its source or its frame, kept but not shown */
    aside > [hidden] {
      display: none;
    }
    /* a picture is shown whole, at the view's top left; a player where
       text starts */
    aside > :is(img, audio) {
      justify-self: start;
    }
    aside > audio {
      margin: var(--above) var(--inset);
    }
    /* the file's bar, the one bar: where the file is, then its tools. each
       a ghost icon, its name and key in its title; a tint under the
       pointer, none at rest */
    nav {
      display: flex;
      align-items: center;
      gap: 0.125rem;
      min-block-size: 3.125rem;
      padding: 0.75rem 1.25rem;
      border-block-end: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.8125rem;
    }
    nav > :first-child {
      flex: 1;
      margin-inline-end: 0.75rem;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    nav b {
      color: var(--ink);
      font-weight: 500;
    }
    nav > :first-child a:hover {
      color: var(--accent);
    }
    nav a:not([href]) {
      opacity: 0.35;
    }
    nav [aria-pressed='true'] {
      color: var(--accent);
    }
    nav button {
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
    }
    .tool {
      display: grid;
      place-items: center;
      inline-size: 1.75rem;
      block-size: 1.75rem;
      border-radius: 6px;
    }
    :is(.tool, dt) svg {
      inline-size: 1rem;
      block-size: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (hover: hover) {
      .tool:is(button, [href]):hover {
        background: color-mix(in oklab, var(--ink) 7%, transparent);
        color: var(--ink);
      }
      .seg button:hover {
        color: var(--ink);
      }
    }
    /* a page and its source, a segmented pair */
    .seg {
      display: flex;
      margin-inline-end: 0.375rem;
      padding: 2px;
      border-radius: 7px;
      background: var(--panel);
      font-size: 0.71875rem;
    }
    .seg button {
      padding: 0.1875rem 0.5625rem;
      border-radius: 5px;
    }
    .seg [aria-pressed='true'] {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
    }
    /* the folds of the whole, while an outline shows, set apart */
    .folds {
      display: none;
      align-items: center;
      gap: 0.125rem;
    }
    aside:has(> .outline:not([hidden])) .folds {
      display: flex;
    }
    .folds::after {
      content: '';
      inline-size: 1px;
      block-size: 1rem;
      margin-inline: 0.25rem;
      background: var(--rule);
    }
    aside :is(iframe, video) {
      display: block;
      inline-size: 100%;
      block-size: 100%;
      border: 0;
    }
    /* a pdf is white paper in either theme; a dark theme inverts it. grey
       first, so a scan's yellowed paper leaves no tint; dimmed last, so the
       ink does not glare. i flips it */
    aside .pdf {
      --dark: grayscale(1) invert(0.94) brightness(0.7);
    }
    @media (prefers-color-scheme: dark) {
      aside .pdf:not(.flip) {
        filter: var(--dark);
      }
    }
    @media (prefers-color-scheme: light) {
      aside .pdf.flip {
        filter: var(--dark);
      }
    }
    /* a video's box is the whole view, a black stage, its picture whole in
       the middle, never cut or stretched, as a player and full screen show
       it */
    aside video {
      object-fit: contain;
      background: #000;
    }
    /* a video does not scroll: no room kept for a scrollbar, so the stage
       is the whole box. :last-child, to outrank the view's */
    aside > video:last-child {
      overflow: clip;
    }
    aside img {
      max-inline-size: 100%;
      max-block-size: 100%;
      object-fit: contain;
    }
    /* text, or a message where the view would be */
    aside > :is(pre, .msg) {
      margin: 0;
      padding: var(--above) var(--inset);
    }
    aside > pre {
      font: 0.8125rem/1.7 var(--mono);
      white-space: pre-wrap;
    }
    /* a text with headings: an outline, a bullet a heading. a folded one
       that holds anything wears a ring; what an open one holds hangs under
       it on a thin guide */
    .outline {
      padding: var(--above) var(--inset);
    }
    .outline pre {
      margin: 0.25rem 0 0.75rem;
      font: 0.8125rem/1.7 var(--mono);
      white-space: pre-wrap;
    }
    /* a diff's lines: what it adds, and what it takes away */
    .outline .add {
      background: color-mix(in oklab, var(--md) 14%, transparent);
    }
    .outline .del {
      background: color-mix(in oklab, var(--pdf) 14%, transparent);
    }
    /* on a phone a block keeps its columns, and scrolls across */
    @media (width < 50rem) {
      .outline pre {
        overflow-x: auto;
        white-space: pre;
      }
    }
    /* a heading's first line in the middle of a row, its bullet on it: a
       heading of python's can take more lines */
    .outline summary {
      display: flex;
      align-items: start;
      min-block-size: var(--row);
      padding-block: calc((var(--row) - 1lh) / 2);
      list-style: none;
      cursor: pointer;
    }
    .outline summary::-webkit-details-marker {
      display: none;
    }
    /* the heading, then figures at the right edge, as page.html spaces them */
    .outline summary > :first-child {
      flex: 1;
    }
    .outline summary > * + * {
      margin-inline-start: 0.625rem;
    }
    @media (hover: hover) {
      .outline summary:hover {
        color: var(--accent);
      }
    }
    /* code's headings are its code: python's def line, a function's
       signature, a rule's selectors, a hunk's @@ */
    .outline:is(.py, .js, .css, .html, .diff) summary {
      font: 0.8125rem/1.7 var(--mono);
      white-space: pre-wrap;
    }
    /* python's decorators and def faint, beside its name */
    .outline .kwd {
      color: var(--muted);
    }
    .outline summary::before {
      content: '';
      flex: none;
      inline-size: 0.375rem;
      aspect-ratio: 1;
      margin-block-start: calc((1lh - 0.375rem) / 2);
      margin-inline: 0.5rem 0.75rem;
      border-radius: 50%;
      background: var(--muted);
    }
    .outline details:has(> div) > summary::before {
      background: var(--ink);
    }
    .outline details:not([open]):has(> div) > summary::before {
      box-shadow: 0 0 0 0.25rem var(--rule);
    }
    .outline details > div {
      margin-inline-start: 0.6875rem;
      padding-inline-start: 0.875rem;
      border-inline-start: 1px solid var(--rule);
    }
    /* the keys are the view's: the heading under its cursor tinted, the
       tree's cursor grey until they are back */
    aside.keys .focus > summary {
      background: color-mix(in oklab, var(--accent) 14%, transparent);
    }
    body:has(aside.keys) .row.focus {
      background: var(--panel);
    }
    .msg {
      margin: 0;
      color: var(--muted);
    }
    /* a card is as tall as the aside: its parts sit at the top, not
       spread down it */
    .card {
      display: grid;
      align-content: start;
      gap: 1rem;
      padding: var(--above) max(2rem, 50% - 20rem);
    }
    /* a card's title is a heading, a page's h1 in size */
    .card h1 {
      margin: 0;
      font-size: 1.0625rem;
      line-height: 1.35;
      text-wrap: balance;
    }
    .card p {
      margin: 0;
      max-inline-size: 34rem;
    }
    .sub {
      color: var(--muted);
      font-size: 1.0625rem;
    }
    .meta {
      color: var(--muted);
      font: 0.75rem var(--mono);
    }
    /* where reading starts or resumes: one quiet line, in the accent */
    .go {
      justify-self: start;
      color: var(--accent);
      font-size: 0.875rem;
    }
    .bar {
      block-size: 3px;
      max-inline-size: 20rem;
      background: var(--rule);
    }
    .bar > i {
      display: block;
      block-size: 100%;
      background: var(--accent);
    }
    .lines {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 0.875rem;
    }
    .lines small {
      color: var(--muted);
      font: 0.6875rem var(--mono);
    }
    /* a folder's tree, its names in line with the card's head */
    .card > div:has(> details) {
      margin-inline: -0.625rem;
    }
    /* side by side, the right's structure starts at its left edge, in the
       gutter the tree has, and takes its width: a folder's card, its head
       in line with its rows' names, an outline, plain text, a player. md
       is prose: a long line keeps its measure, from the left */
    @media (width >= 50rem) {
      aside {
        --inset: 0.5rem;
      }
      .outline.md {
        padding-inline-end: max(0.5rem, 100% - 44.5rem);
      }
      .card {
        padding-inline: 1.125rem;
      }
    }

    /* a box, as a page's: as wide, its corners round */
    dialog {
      inline-size: min(44rem, 100% - 2rem);
      margin-block-start: 12vh;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 12px 40px rgb(0 0 0 / 0.2);
    }
    dialog::backdrop {
      background: rgb(0 0 0 / 0.15);
    }
    dialog input {
      inline-size: 100%;
      padding: 0.875rem 1rem;
      border: 0;
      border-block-end: 1px solid var(--rule);
      background: none;
      color: inherit;
      font: 1.0625rem var(--sans);
      outline: 0;
    }
    dialog ol {
      margin: 0;
      padding: 0.25rem;
      list-style: none;
      max-block-size: 50vh;
      overflow: auto;
    }
    dialog li {
      display: flex;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      cursor: pointer;
    }
    dialog small {
      margin-inline-start: auto;
      color: var(--muted);
      font: 0.6875rem/1.9 var(--mono);
      white-space: nowrap;
    }
    [aria-selected='true'] {
      background: var(--accent);
      color: var(--paper);
    }
    [aria-selected='true'] small {
      color: inherit;
    }
    /* the keys box has nothing to focus but itself */
    dialog:focus {
      outline: 0;
    }
    /* the keys, a dl, in a page's text */
    dialog:has(dl) {
      font: 0.875rem/1.55 var(--sans);
    }
    dialog dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.375rem 1rem;
      margin: 0;
      padding: 1rem 1.25rem;
    }
    dialog dd {
      margin: 0;
      color: var(--muted);
    }
    kbd {
      font: 0.8125rem var(--mono);
    }
    /* a key the file's bar holds, its icon beside it */
    dt svg {
      margin-inline-start: 0.5rem;
      vertical-align: -0.1875rem;
    }

    /* one at a time: the pane, or the file open */
    @media (width < 50rem) {
      body.ready {
        grid-template-columns: minmax(0, 1fr);
      }
      body.ready main {
        inline-size: auto;
        max-inline-size: none;
        resize: none;
        border: 0;
      }
      body:not(.viewing) aside,
      body.viewing main {
        display: none;
      }
      /* the file open is the whole width already: no tool for it, and the
         path has its room */
      nav [data-key='f'] {
        display: none;
      }
    }

    /* -- local -- */
    /* a block has no tick: its column gets the row's width */
    .prose > .row:has(pre) {
      grid-template: 'text' / minmax(0, 1fr);
    }
    /* .prose .text outranks pre.text's size; a path keeps the block's */
    .prose pre.text {
      font-size: 0.6875rem;
    }
    pre.text code {
      font: inherit;
    }
    /* the viewer gets most of the screen: side by side, the pane takes a
       third of the width; upright, the viewer sits on top and the pane
       scrolls below it */
    @media (width >= 50rem) {
      body.ready main {
        inline-size: min(35vw, 32rem);
      }
    }
    @media (width >= 50rem) and (orientation: portrait) {
      body.ready {
        grid-template: minmax(0, 3fr) minmax(0, 2fr) / minmax(0, 1fr);
      }
      body.ready aside {
        grid-row: 1;
      }
      body.ready main {
        grid-row: 2;
        inline-size: auto;
        max-inline-size: none;
        resize: none;
        border-inline-end: 0;
        border-block-start: 1px solid var(--rule);
      }
    }
  </style>

  <!-- -- content -- -->
  <main>
    <div class="landing">
      <h1>Shelf</h1>
      <p>
        The folder beside this page, a tree that unfolds in place: a folder
        unfolds to its files, and one that holds a <code>path.md</code> to its
        stages first. The files are read where they are: from the server that
        sent this page or, opened as a file, from the folder you choose, the
        one it sits in.
      </p>
      <p><button hidden>Choose folder</button> <output></output></p>
    </div>
  </main>
  <aside></aside>
  <dialog>
    <input placeholder="Find an entry or a file" autocomplete="off" />
    <ol role="listbox"></ol>
  </dialog>

  <!-- an epub's own styles sit in a lower layer, so these win without
     !important -->
  <template id="book">
    <style>
      :host {
        display: block;
        padding: var(--above) max(1.5rem, 50% - 20rem) 6rem;
        font: 1.125rem/1.7 var(--serif);
      }
      * {
        font-family: inherit;
        color: inherit;
        background-color: transparent;
      }
      :is(code, pre, kbd, samp, tt) {
        font-family: var(--mono);
      }
      a {
        color: var(--accent);
      }
      :is(img, svg) {
        max-inline-size: 100%;
        block-size: auto;
      }
      section {
        content-visibility: auto;
        contain-intrinsic-size: auto 100dvh;
      }
      section + section {
        margin-block-start: 4rem;
      }
    </style>
  </template>

  <script type="module">
    // -- engine --
    const el = (tag, props) =>
      Object.assign(document.createElement(tag), props);
    const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt()};`);
    // check wants a typed in-page link to name an id in this file, and these
    // name paths: so none is typed, each is made here
    const hash = path => esc(`#${path}`);
    const main = document.querySelector('main');
    const aside = document.querySelector('aside');
    const output = main.querySelector('output');
    // here is the place shown, a folder or a stage
    let library, root, here, focused;

    // path.md may climb out of its folder: cs/../math/dm is math/dm
    function clean(path) {
      const parts = [];
      for (const p of path.split('/'))
        if (p === '..') parts.pop();
        else if (p && p !== '.') parts.push(p);
      return parts.join('/');
    }
    const join = (dir, name) => clean(`${dir}/${name}`);
    const parent = path => path.split('/').slice(0, -1).join('/');
    const basename = path => path.split('/').at(-1);
    // a name's last dot starts its extension, unless the dot starts the
    // name: .gitignore has none
    const ext = path => path.match(/[^/]\.(\w+)$/)?.[1].toLowerCase();

    // keyed by a path from the root, so a key names one file wherever it is
    // listed. a titled entry ticks by its title instead: the tick outlives
    // an edit to path.md that keeps the title
    const stored = name => JSON.parse(localStorage.getItem(name));
    // what is kept under one prefix moves under another
    function carry(from, to) {
      for (const k of Object.keys(localStorage)) {
        if (!k.startsWith(from)) continue;
        localStorage.setItem(
          to + k.slice(from.length),
          localStorage.getItem(k),
        );
        localStorage.removeItem(k);
      }
    }
    // this page was path.html, which kept the same under pathreader:
    carry('pathreader:', 'shelf:');
    // pos is fm's: the name under the cursor, per folder or stage. beside
    // it the unfolds, the folders and stages left unfolded, so a reload
    // unfolds them again, and dots, whether names that start with a dot
    // show
    let done = new Set(stored('shelf:done')),
      pos = stored('shelf:pos') ?? {},
      unfolds = new Set(stored('shelf:unfolds')),
      dots = stored('shelf:dots') ?? true;
    document.body.classList.toggle('nodots', !dots);
    const keep = () => {
      localStorage.setItem('shelf:done', JSON.stringify([...done]));
      localStorage.setItem('shelf:pos', JSON.stringify(pos));
      localStorage.setItem('shelf:unfolds', JSON.stringify([...unfolds]));
      localStorage.setItem('shelf:dots', JSON.stringify(dots));
    };
    const at = path => localStorage.getItem(`shelf:at:${path}`);

    // a root chosen above the last: what was kept under the last moves under
    // the new, math's calc/x to math/calc/x. a title is no path and stays
    function rebase(prefix) {
      const titles = new Set(
        [...folders.values()].flatMap(entries).map(e => e.title),
      );
      done = new Set(
        [...done].map(k => (titles.has(k) ? k : join(prefix, k))),
      );
      pos = Object.fromEntries(
        Object.entries(pos).map(kv => kv.map(k => join(prefix, k))),
      );
      unfolds = new Set([...unfolds].map(k => join(prefix, k)));
      keep();
      carry('shelf:at:', `shelf:at:${prefix}/`);
      const place = stored('shelf:place');
      if (place !== null)
        localStorage.setItem(
          'shelf:place',
          JSON.stringify(join(prefix, place)),
        );
    }

    // -- markdown --
    // a path in backticks runs from its subject's folder
    const inline = (s, dir = '') =>
      s
        .split(/`([^`]+)`/)
        .map((t, i) =>
          i % 2
            ? `<a href="${hash(join(dir, t))}"><code>${esc(t)}</code></a>`
            : esc(t)
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/\b'\b/g, '’'),
        )
        .join('');

    // a folder's path.md: its # heading is the title, the lines under it the
    // note, and each ## a stage
    function parse(md, dir) {
      const [head, ...stages] = md.split(/^(?=## )/m);
      return {
        title: head.match(/^# (.*)/m)?.[1] ?? dir,
        note: head
          .split('\n')
          .filter(l => l.trim() && !/^#|^-{3,}$/.test(l))
          .map(l => `<p>${inline(l, dir)}</p>`)
          .join(''),
        stages: stages.map(stage => {
          const [, heading, body] = stage.match(/^## (.*)\n?([^]*)/);
          const html = inline(heading, dir);
          const node = {
            kind: 'stage',
            html: `<span class="text">${html}</span>`,
            key: `${dir && `${dir}/`}stage:${html}`,
            kids: items(body, dir),
          };
          for (const kid of node.kids) kid.up = node;
          return node;
        }),
      };
    }

    // a block, indented or a table, is laid out by its spaces, so it is kept
    // as written. a break, ---, is dropped: the headings already part the
    // stages
    function items(body, dir) {
      const kids = [];
      let group = '';
      const prose = html => kids.push({ kind: 'prose', html, group });
      for (const chunk of body.match(/(?:^(?: {4}|\|).*\n?)+|^.*\S.*$/gm) ??
        []) {
        const [, n, item] = chunk.match(/^(?:(\d+)\.|-) (.*)/) ?? [];
        if (/^\*\*[^*]+\*\*$/.test(chunk))
          group = inline(chunk.slice(2, -2), dir);
        else if (item) kids.push({ ...entry(item, dir), n: n ?? '', group });
        else if (/^( {4}|\|)/.test(chunk))
          prose(`<pre class="text">${inline(chunk.trimEnd(), dir)}</pre>`);
        else if (!/^-{3,}$/.test(chunk))
          prose(`<p class="text">${inline(chunk, dir)}</p>`);
      }
      return kids;
    }

    // cs/path.md's entries are bare paths: such an entry shows its paths as
    // its text
    function entry(item, dir) {
      const [, lead, rest] = item.match(/^((?:`[^`]+`(?:, )?)*)(?: — )?(.*)/);
      const title = rest.match(/^\*\*(.+?)\*\*/)?.[1];
      const note = title
        ? inline(
            rest.slice(title.length + 4).replace(/^\s*(?:—\s*)?/, ''),
            dir,
          )
        : '';
      // the paths it names, in its lead or its note: it opens the first
      const paths = [...item.matchAll(/`([^`]+)`/g)].map(m => join(dir, m[1]));
      const says = title
        ? `<strong>${inline(title, dir)}</strong>` +
          (note && `<span class="note">${note}</span>`)
        : inline(rest, dir);
      const where = lead && `<p class="where">${inline(lead, dir)}</p>`;
      return {
        kind: title || paths.length ? 'entry' : 'prose',
        name: title ?? paths[0],
        path: paths[0],
        paths,
        title,
        note,
        html: says
          ? `${where}<p class="text">${says}</p>`
          : `<p class="text">${inline(lead, dir)}</p>`,
      };
    }

    // -- pane --
    // one kind of node for every row: { kind, html, n, name, path, group,
    // kids, up }. kind is stage, entry, prose or file, and a folder is a
    // file whose kids are null until it is read. a folder or a stage folds,
    // its kids the rows under it: a folder's its stages first if it holds a
    // path.md, then its files; a stage's its entries. a row is drawn once
    // and its kids' list once, so folding and going back draw nothing again
    const folds = node => node.kids !== undefined;
    // an entry carries its own number, path.md's
    const tick = ({ name, n = '' }) =>
      name
        ? `<label class="tick"><input type="checkbox" name="${esc(name)}"` +
          ` title="Done"${done.has(name) ? ' checked' : ''}>${n}</label>`
        : '';
    // a stage has no path, so it carries its own key
    const key = node => node.key ?? node.path;
    const label = node => node.title ?? basename(node.path ?? node.name);
    const dotted = node =>
      node.kind === 'file' && basename(node.path).startsWith('.');
    function draw(node) {
      const li = el('li', { className: node.kind, node });
      li.classList.toggle('folder', node.kind === 'file' && folds(node));
      li.classList.toggle('dot', dotted(node));
      node.li = li;
      li.innerHTML = `<div class="row">${tick(node)}${node.html}</div>`;
      return li;
    }
    function branch(kids) {
      const ul = el('ul');
      let group = '';
      for (const kid of kids) {
        if (kid.group && kid.group !== group)
          ul.append(el('li', { className: 'group', innerHTML: kid.group }));
        group = kid.group ?? '';
        ul.append(draw(kid));
      }
      return ul;
    }

    // a folder is one node however it is reached, so it keeps its rows and
    // the cursor in them
    const folders = new Map();
    function file(path, folder) {
      if (folders.has(path)) return folders.get(path);
      const left = at(path);
      const kind = folder ? undefined : ext(path);
      // the tag says the kind, so the name shows without it; the
      // extension stays in the text, hidden, for find
      const base = esc(basename(path)).replace(
        /\.\w+$/,
        kind ? '<span class="ext">$&</span>' : '$&',
      );
      const node = {
        kind: 'file',
        path,
        name: folder ? undefined : path,
        kids: folder ? null : undefined,
        html:
          `<span class="text">${base}</span>` +
          (kind ? `<i class="kind" data-kind="${esc(kind)}"></i>` : '') +
          `<small>${left ? clock(left) : ''}</small>`,
      };
      if (folder) folders.set(path, node);
      return node;
    }

    // a folder that holds a path.md is a subject: its title, note and stages
    // come from it
    const subject = node =>
      (node.parsing ??= library
        .url(join(node.path, 'path.md'))
        .then(read)
        .then(res => res.text())
        .then(
          md => {
            Object.assign(node, parse(md, node.path));
            for (const stage of node.stages) stage.up = node;
          },
          () => {},
        ));
    // read once, however many ask: a folder's listing and its path.md, and
    // the path.md of each folder in it, so a subject there shows its t/n.
    // this page is no row of its own shelf
    const page = decodeURIComponent(location.pathname.split('/').at(-1));
    const listing = node =>
      (node.reading ??= Promise.all([contents(node.path), subject(node)]).then(
        async ([list]) => {
          const files = list
            .filter(e => !(node.stages && e.name === 'path.md'))
            .filter(e => node.path || e.name !== page)
            .map(e => file(join(node.path, e.name), e.kind === 'directory'));
          const group = node.stages?.length ? 'files' : '';
          for (const f of files) Object.assign(f, { up: node, group });
          await Promise.all(
            files.filter(f => f.kids !== undefined).map(subject),
          );
          node.kids = [...(node.stages ?? []), ...files];
        },
      ));

    // t/n: the entries ticked under a stage, or under every stage of a
    // folder
    const entries = node =>
      node.kind === 'stage'
        ? node.kids.filter(k => k.kind === 'entry')
        : (node.stages ?? []).flatMap(entries);
    const count = node => {
      const all = entries(node);
      return [all.filter(e => done.has(e.name)).length, all.length];
    };

    // the place: each folder above it a way back, and how much of its path
    // is ticked
    const header = el('header'),
      footer = el('footer');
    const crumbs = path => {
      const parts = path.split('/').filter(Boolean);
      return [library.name, ...parts]
        .map((name, i) =>
          i < parts.length
            ? `<a href="${hash(parts.slice(0, i).join('/'))}">${esc(name)}</a>`
            : `<b>${esc(name)}</b>`,
        )
        .join(' / ');
    };
    function tally() {
      // a path's tick is one wherever it is listed: an entry with no title,
      // and the file it names, show the same
      for (const box of main.querySelectorAll('.tick > input'))
        box.checked = done.has(box.name);
      for (const row of rows()) {
        const node = nodeof(row);
        if (node.kind !== 'stage' && !node.stages) continue;
        const [ticked, all] = count(node);
        row.dataset.count = all ? `${ticked}/${all}` : '';
      }
      const [ticked, all] = count(here);
      header.innerHTML =
        `<h1>${crumbs(here.path)}</h1>` +
        (all ? `<small>Path ${ticked}/${all}</small>` : '') +
        '<button>? keys</button>' +
        (here.stages ? `<p>${inline(here.title, here.path)}</p>` : '');
      // the bar's ✓ says whether the file open is ticked
      aside
        .querySelector('nav [data-key=x]')
        ?.setAttribute('aria-pressed', opened()?.checked ?? false);
    }
    // the tick of the file open, its row's
    const opened = () => main.querySelector('[aria-current] > .row input');

    // the cursor lands in a folder or a stage on the name given, else on the
    // one it was left on, else on its first row
    const landing = (node, name = pos[key(node)]) =>
      node.kids.find(k => name && key(k) === name)?.li.firstChild ??
      node.list.querySelector('.row');
    // in a place, on down from there through each fold left unfolded, to
    // the row pos names in it
    function resume(node, name) {
      let row = landing(node, name);
      for (let at = nodeof(row); at && unfolded(at); at = nodeof(row)) {
        const under = pos[key(at)],
          kid = under && at.kids.find(k => key(k) === under);
        if (!kid) break;
        row = kid.li.firstChild;
      }
      return row;
    }
    // what a list's rows name is looked up once, the first time it shows
    const lookup = node =>
      (node.marked ??= Promise.all(
        [...node.list.querySelectorAll('a')].map(mark),
      ));

    // a place is the folder at the top of the tree. its rows are read on the
    // first visit, and what was left unfolded in it unfolds again
    let entering;
    async function enter(node, name) {
      const ask = (entering = {});
      if (node.kids === null) await listing(node);
      if (ask !== entering) return;
      here = node;
      localStorage.setItem('shelf:place', JSON.stringify(node.path));
      node.list ??= branch(node.kids);
      main.replaceChildren(header, node.list, footer);
      tally();
      focus(landing(node, name));
      lookup(node);
      await reopen(node);
      if (ask === entering) focus(resume(node, name));
    }

    // a folder or a stage unfolds under its own row, read on the first
    // unfold, with what was left unfolded under it, and folds back onto it.
    // the unfolds keep both
    const unfolded = node => node.list?.parentNode === node.li;
    async function unfold(node) {
      if (node.kids === null) await listing(node);
      node.list ??= branch(node.kids);
      node.li.append(node.list);
      unfolds.add(key(node));
      keep();
      tally();
      lookup(node);
      await reopen(node);
    }
    async function reopen(node) {
      for (const kid of node.kids)
        if (folds(kid) && unfolds.has(key(kid)) && !unfolded(kid))
          await unfold(kid);
    }
    function fold(node) {
      node.list.remove();
      unfolds.delete(key(node));
      focus(node.li.firstChild);
    }
    const toggle = node => (unfolded(node) ? fold(node) : unfold(node));

    // -- library --
    // the page asks the library four things: what is at a path, what a
    // folder holds, a url for a file, and a folder's weight, which only
    // quark.mjs answers. opened as a file, the library is a folder chosen in
    // the browser's picker; served over http, it is the server
    async function read(url, init) {
      const res = await fetch(url, init);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res;
    }

    function disk(root) {
      const handle = async path => {
        let h = root;
        for (const name of path.split('/').filter(Boolean))
          h = await h
            .getDirectoryHandle(name)
            .catch(() => h.getFileHandle(name));
        return h;
      };
      return {
        name: root.name,
        async stat(path) {
          const h = await handle(path);
          return h.kind === 'directory'
            ? { kind: 'directory' }
            : { kind: 'file', size: (await h.getFile()).size };
        },
        list: async path => Array.fromAsync((await handle(path)).values()),
        // a blob url refers to the file, not a copy of its bytes: none is
        // worth revoking
        url: async path =>
          URL.createObjectURL(await (await handle(path)).getFile()),
        weigh: async () => ({}),
      };
    }

    // quark -l lists a folder as one link per entry, a folder's ending in a
    // slash
    function web(base) {
      const href = path =>
        new URL(path.split('/').map(encodeURIComponent).join('/'), base).href;
      return {
        name: decodeURIComponent(base.pathname.split('/').at(-2)) || base.host,
        async stat(path) {
          const res = await read(href(path), { method: 'HEAD' });
          // a folder asked for without its slash is redirected to it
          return res.url.endsWith('/')
            ? { kind: 'directory' }
            : { kind: 'file', size: +res.headers.get('content-length') };
        },
        async list(path) {
          const index = await (
            await read(href(path ? `${path}/` : ''))
          ).text();
          const links = new DOMParser()
            .parseFromString(index, 'text/html')
            .querySelectorAll('a:not([href=".."])');
          return [...links]
            .map(a => a.getAttribute('href'))
            .map(name =>
              name.endsWith('/')
                ? { name: name.slice(0, -1), kind: 'directory' }
                : { name, kind: 'file' },
            );
        },
        url: async path => href(path),
        // quark.mjs answers ?du with a folder's weight; another server sends
        // its page, and the folder is not weighed
        weigh: path =>
          read(href(path ? `${path}/` : '') + '?du')
            .then(res => res.json())
            .catch(() => ({})),
      };
    }

    const collate = new Intl.Collator(undefined, { numeric: true }).compare;
    const contents = async dir =>
      (await library.list(dir))
        .sort((a, b) => collate(a.name, b.name));

    // several entries can name one folder, each for one book in it: a folder
    // named with a title leads to the one file there whose name holds every
    // word of the title
    const words = s =>
      new Set(
        s
          .normalize('NFD')
          .toLowerCase()
          .replace(/\p{M}|['’]/gu, '')
          .match(/[a-z0-9]{2,}/g),
      );
    async function pick(dir, title) {
      const want = words(title);
      const [only, ...more] = (await library.list(dir)).filter(({ name }) =>
        want.isSubsetOf(words(name)),
      );
      return more.length ? undefined : only?.name;
    }

    // an entry is what its first path is: a file of some type, a folder, or
    // nothing yet, to acquire
    async function mark(a) {
      let path = clean(decodeURIComponent(a.hash.slice(1)));
      let stat = await library.stat(path).catch(() => null);
      const node = a.closest('.entry')?.node;
      const first = node && a === node.li.querySelector('a');
      const inner =
        first &&
        stat?.kind === 'directory' &&
        node.title &&
        (await pick(path, node.title).catch(() => undefined));
      if (inner) {
        path = join(path, inner);
        stat = await library.stat(path);
        a.hash = path;
      }
      const absent = !stat
        ? 'not on disk'
        : stat.size === 0
          ? 'empty file'
          : '';
      a.title = absent || path;
      if (absent) a.dataset.absent = '';
      if (!first) return;
      node.path = path;
      node.li.firstChild.dataset.type = absent
        ? 'acquire'
        : stat.kind === 'directory'
          ? 'folder'
          : (ext(path) ?? 'file');
    }

    // -- viewer --
    const msg = s => el('p', { className: 'msg', textContent: s });
    const clock = s =>
      `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    // a lecture plays once open, from where it was left; previewed, it only
    // shows itself
    const media = tag => (src, path) => {
      const place = `shelf:at:${path}`;
      const player = el(tag, {
        src,
        controls: true,
        autoplay: viewing(),
        currentTime: localStorage.getItem(place) ?? 0,
      });
      player.ontimeupdate = () =>
        localStorage.setItem(place, player.currentTime);
      player.onended = () => localStorage.removeItem(place);
      return player;
    };
    const video = media('video'),
      audio = media('audio');
    const image = (src, path) => el('img', { src, alt: path });
    const text = async src =>
      el('pre', { textContent: await (await read(src)).text() });
    const frame = src =>
      el('iframe', {
        src,
        className: 'page',
        onload: ({ target }) => hook(target),
      });
    const viewers = {
      pdf,
      // served, a page's links to its neighbours resolve; from the picker
      // it is a blob, and they do not
      html: frame,
      djvu,
      epub,
      mp4: video,
      mkv: video,
      webm: video,
      mp3: audio,
      m4a: audio,
      ogg: audio,
      png: image,
      jpg: image,
      jpeg: image,
      gif: image,
      webp: image,
      svg: image,
      txt: text,
      md: outline('md'),
      py: outline('py'),
      // source only: a page is its source too, flipped to by u
      js: outline('js'),
      mjs: outline('js'),
      css: outline('css'),
      diff: outline('diff'),
      patch: outline('diff'),
      // a leaf: a note or a plan has no extension, and is text, its
      // headings an outline
      '': outline('leaf'),
    };

    async function show(path, size) {
      if (!size) return msg('This file is empty');
      const viewer = viewers[ext(path) ?? ''];
      return viewer
        ? viewer(await library.url(path), path)
        : msg(`No viewer for ${basename(path)}`);
    }

    // a folder a path.md names is reading: in an entry's lead or its note,
    // from any subject, as cs's ../math/dm. each folder above it has its
    // path.md read first
    async function named(path) {
      const above = path.split('/').map((_, i, all) => all.slice(0, i));
      await Promise.all(above.map(up => subject(file(up.join('/'), true))));
      return [...folders.values()]
        .flatMap(entries)
        .some(e => e.paths.includes(path));
    }
    // a folder a path.md names is taken up where it was left: the file left
    // part way, or the first, a line under its head. any other folder
    // offers none. an entry naming it gives its title and note. under that,
    // its tree, with an outline's keys. a file in it opens in the tree on
    // the left, by l, enter or a tap: the right opens no right of its own
    async function card(path, node) {
      const own = node?.path === path,
        folder = file(path, true);
      await listing(folder);
      const files = folder.kids.filter(k => !folds(k)).map(k => k.path);
      // reading starts at a file whose name does not start with a dot
      const next =
          (await named(path)) &&
          (files.find(at) ?? files.find(p => !basename(p).startsWith('.'))),
        left = next && at(next);
      const link = next
        ? `<a class="go" href="${hash(next)}">` +
          `${left ? 'Resume' : 'Start'} → ` +
          esc(basename(next).replace(/\.\w+$/, '')) +
          `${left ? ` · ${clock(left)}` : ''}</a>`
        : '';
      const title =
        own && node.title ? inline(node.title) : esc(basename(path));
      const shown = el('div', {
        className: 'card',
        innerHTML:
          `<p class="kicker">${files.length} files</p><h1>${title}</h1>` +
          (own && node.note ? `<p class="sub">${node.note}</p>` : '') +
          `<p class="meta">${esc(path)}/</p>${link}`,
      });
      // weighed once, as a folder is read once
      const box = (folder.box ??= { path, w: {}, top: {} });
      const weighed = (folder.weighed ??= library.weigh(path).then(w => {
        box.w = w;
        for (const [p, [size]] of Object.entries(w))
          if (p) box.top[parent(p)] = Math.max(box.top[parent(p)] ?? 0, size);
      }));
      // a slow du does not hold the card: its rows open by depth, and are
      // stamped when it answers. they open by what is in hand now
      await Promise.race([weighed, new Promise(ok => setTimeout(ok, 400))]);
      box.open = box.w;
      shown.appendChild(el('div')).append(...(await under(folder, 1, box)));
      weighed.then(() => {
        for (const row of shown.querySelectorAll('summary.row'))
          stamp(box, row);
      });
      keyed(shown);
      const open = verb => () =>
        folds(shown.at.node) ? verb() : (location.hash = shown.at.node.path);
      shown.verbs.right = open(shown.verbs.right);
      shown.verbs.toggle = open(shown.verbs.toggle);
      shown.addEventListener('click', e => {
        const d = e.target.closest('summary')?.parentElement;
        if (d && !folds(d.node)) location.hash = d.node.path;
      });
      return shown;
    }
    // a path from the card's folder, as the weights key it
    const within = ({ path }, p) => (path ? p.slice(path.length + 1) : p);
    // bytes in four characters at most, as ls -h has them: 999B 9.9K 99K
    const weight = n => {
      let i = 0;
      for (; n >= 1000 && i < 4; i++) n /= 1024;
      return (n < 9.95 && i ? n.toFixed(1) : Math.round(n)) + 'BKMGT'[i];
    };
    // a row's weight: its bytes as a bar against its heaviest sibling's, its
    // size, and its entries, none for a file. it may come after the rows are
    // drawn: those are stamped when it does, a row drawn later as it is
    // drawn, and a server with none stamps none
    function stamp(box, row) {
      const { node } = row.parentElement,
        p = within(box, node.path),
        [size, entries] = box.w[p] ?? [];
      if (size === undefined || row.querySelector(':scope > .wt')) return;
      const up = parent(p);
      const mark = el('span', { className: 'wt' });
      mark.dataset.size = weight(size);
      mark.dataset.entries = entries || '';
      mark.style.setProperty('--w', `${(100 * size) / (box.top[up] || 1)}%`);
      row.append(mark);
    }
    // a folder's rows in its tree on the right, as the tree draws them, each
    // a heading that folds, a node whose id is its path, as the outline's
    // keys need. two levels show at first: a folder in a folder
    // starts folded, as does one of over 30 rows, its count beside it, or
    // one whose name starts with a dot; weighed in time, a folder opens if
    // it holds a fifth of the one it is in, to three levels. what it holds
    // is drawn when it unfolds
    async function under(folder, depth, box) {
      const kids = folder.kids.filter(k => k.kind === 'file'),
        [whole] = box.open[within(box, folder.path)] ?? [];
      await Promise.all(kids.filter(folds).map(listing));
      return Promise.all(
        kids.map(async node => {
          const shown = el('details', {
              className: 'file',
              id: node.path,
              node,
            }),
            row = el('summary', { className: 'row', innerHTML: node.html });
          shown.classList.toggle('dot', dotted(node));
          shown.append(row);
          stamp(box, row);
          if (!folds(node)) return shown;
          shown.classList.add('folder');
          const div = shown.appendChild(el('div')),
            rows = node.kids.filter(k => k.kind === 'file').length;
          row.dataset.count = rows;
          const fill = async () =>
            div.append(...(await under(node, depth + 1, box)));
          // by weight when du answered in time: a folder opens if it holds a
          // fifth of the one it is in, else by depth
          const [mine] = box.open[within(box, node.path)] ?? [];
          shown.open =
            !dotted(node) &&
            (mine === undefined
              ? depth < 2 && rows <= 30
              : depth < 3 && rows <= 30 && mine * 5 >= whole);
          if (shown.open) await fill();
          else shown.addEventListener('toggle', fill, { once: true });
          return shown;
        }),
      );
    }

    // a subject an entry names: its stages, and how much is ticked
    function summary(node) {
      const [ticked, all] = count(node),
        title = inline(node.title, node.path);
      const lines = node.stages.map(
        k => `<li>${k.html} <small>${count(k).join('/')}</small></li>`,
      );
      return el('section', {
        className: 'card',
        innerHTML:
          `<p class="kicker">${esc(join(node.path, 'path.md'))}</p>` +
          `<h1><a href="${hash(node.path)}">${title}</a></h1>` +
          `<div class="sub">${node.note ?? ''}</div>` +
          `<p class="meta">${ticked} of ${all} ticked</p><div class="bar">` +
          `<i style="inline-size: ${all && (100 * ticked) / all}%"></i></div>` +
          `<ol class="lines">${lines.join('')}</ol>`,
      });
    }

    async function view(p, stat, node) {
      if (!stat) return msg('Nothing is at this path');
      if (stat.kind === 'file') return show(p, stat.size);
      const folder = file(p, true);
      await subject(folder);
      return folder.stages ? summary(folder) : card(p, node);
    }

    // a view moves between the preview and the viewer as it is, for drawing
    // a book again is slow; and it stays where it is, for a frame moved is a
    // frame loaded again. a player is drawn again, so it plays only open
    const plays = path => [video, audio].includes(viewers[ext(path) ?? '']);
    const kept = path => {
      const shown = aside.lastChild;
      return shown?.path === path && !plays(path) ? shown : undefined;
    };
    function present(shown, bar) {
      if (shown.parentNode !== aside)
        return aside.replaceChildren(...(bar ? [bar] : []), shown);
      for (const kid of [...aside.children]) if (kid !== shown) kid.remove();
      if (bar) shown.before(bar);
    }

    // beside the pane while nothing is open: what the row under the cursor
    // names. it waits for the keys to rest, so rows passed by open nothing
    let resting;
    function preview() {
      clearTimeout(resting);
      const node = nodeof(focused);
      if (!node || viewing() || !aside.checkVisibility()) return;
      resting = setTimeout(async () => {
        const shown = await peek(node).catch(error =>
          msg(`Could not show this: ${error.message}`),
        );
        if (shown && node === nodeof(focused) && !viewing()) present(shown);
      }, 200);
    }
    // a file its page, an entry what it names, a folder its card, a subject
    // its summary. a stage shows nothing: it unfolds in the tree. prose is
    // all there in its row already
    async function peek(node) {
      if (node.path === undefined) return el('div');
      await node.up.marked;
      const p = node.path;
      const shown =
        kept(p) ??
        (await view(p, await library.stat(p).catch(() => null), node));
      shown.path = p;
      return shown;
    }

    // the file's bar: a tool for each key it answers to, its name, and its
    // icon's strokes on a 16 grid. ? shows each icon beside its key
    const tools = {
      e: ['Expand all', 'M4 6l4 4 4-4'],
      c: ['Collapse all', 'M4 10l4-4 4 4'],
      p: ['Previous file', 'M10 4l-4 4 4 4'],
      n: ['Next file', 'M6 4l4 4-4 4'],
      x: ['Tick', 'M3.5 8.5l3 3 6-7'],
      f: [
        'Full width',
        'M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10',
        // pressed: the corners turn in, as the way back
        'M6 2.5V6H2.5M10 2.5V6h3.5M10 13.5V10h3.5M6 13.5V10H2.5',
      ],
      esc: ['Close', 'M4 4l8 8M12 4l-8 8'],
    };
    const icon = (key, on) =>
      '<svg viewBox="0 0 16 16" aria-hidden="true">' +
      `<path d="${tools[key][on ? 2 : 1]}"/></svg>`;
    // a tool: its icon, its name and key in its title, as a screen reader
    // hears it too. a toggle's state is its aria-pressed, from its caller
    const tool = (tag, key, attrs = '', on = false) => {
      const said = `${tools[key][0]} (${key})`;
      return (
        `<${tag} class="tool" data-key="${key}" title="${said}"` +
        ` aria-label="${said}"${attrs}>${icon(key, on)}</${tag}>`
      );
    };

    async function navbar(p) {
      const [prev, next] = await siblings(p).catch(() => []);
      const near = to => (to ? ` href="${hash(to)}"` : '');
      const wide = document.body.classList.contains('wide');
      return el('nav', {
        innerHTML:
          `<span>${crumbs(p)}</span>` +
          // the folds come and go with the outline, on the left of the
          // rest: a flip moves no tool
          `<span class="folds">${tool('button', 'e')}` +
          `${tool('button', 'c')}</span>` +
          (ext(p) === 'html'
            ? '<span class="seg">' +
              '<button data-key="u" value="page" title="Page (u)">Page' +
              '</button><button data-key="u" value="source"' +
              ' title="Source (u)">Source</button></span>'
            : '') +
          tool('a', 'p', ` rel="prev"${near(prev)}`) +
          tool('a', 'n', ` rel="next"${near(next)}`) +
          (opened()
            ? tool('button', 'x', ` aria-pressed="${opened().checked}"`)
            : '') +
          tool('button', 'f', ` aria-pressed="${wide}"`, wide) +
          tool('a', 'esc', ` href="${hash(here.path)}"`),
      });
    }
    // the files beside it: a folder is a place, not a page to turn to, and
    // a name . hides is not one beside it
    async function siblings(p) {
      const dir = parent(p),
        names = (await contents(dir))
          .filter(e => e.kind !== 'directory')
          .filter(e => dots || !e.name.startsWith('.'))
          .map(e => e.name);
      const i = names.indexOf(basename(p));
      return [names[i - 1], names[i + 1]].map(n => n && join(dir, n));
    }

    // -- route --
    // the hash is the place, or the file open: what a link, a key or a
    // reload asks for. any await can be overtaken by a newer hash, which
    // then owns the pane and the aside
    const viewing = () => document.body.classList.contains('viewing');
    // a file opens where it is a row: the cursor's, else the first in the
    // tree, a stage's entry before a folder's file. else in its folder
    const rowof = p => [focused, ...rows()].find(r => nodeof(r)?.path === p);
    // the folders from the place down to a path unfold, while each is a row
    async function reveal(p) {
      const parts = p.split('/'),
        from = here.path.split('/').filter(Boolean).length + 1;
      for (let n = from; n < parts.length; n++) {
        const folder = file(parts.slice(0, n).join('/'), true);
        if (!folder.li) return;
        if (!unfolded(folder)) await unfold(folder);
      }
    }
    async function route() {
      // a new hash hands the keys back to the tree, and owns the aside
      // before a preview resting there can
      back();
      clearTimeout(resting);
      const was = location.hash,
        p = clean(decodeURIComponent(was.slice(1)));
      const stat = await library.stat(p).catch(() => null);
      if (was !== location.hash) return;
      main.querySelector('[aria-current]')?.removeAttribute('aria-current');
      if (stat?.kind === 'directory') {
        document.body.classList.remove('viewing', 'wide');
        // closed, a file leaves the cursor where it was opened
        if (here.path !== p) await enter(file(p, true));
        if (was !== location.hash) return;
        // what was open stays only as the preview of the row under the
        // cursor, and without its bar
        const shown = kept(nodeof(focused)?.path ?? '');
        if (shown) present(shown);
        else aside.replaceChildren();
        return preview();
      }
      if (stat && !rowof(p) && p.startsWith(here.path && `${here.path}/`))
        await reveal(p);
      if (stat && !rowof(p)) await enter(file(parent(p), true), p);
      if (was !== location.hash) return;
      document.body.classList.add('viewing');
      const row = rowof(p)?.parentElement;
      if (row) {
        row.ariaCurrent = 'page';
        focus(row.firstChild);
      }
      const nav = await navbar(p);
      if (was !== location.hash) return;
      let shown = kept(p);
      if (!shown) {
        aside.replaceChildren(nav, msg('Opening…'));
        shown = await view(p, stat, row?.node).catch(error =>
          msg(`Could not open this: ${error.message}`),
        );
        shown.path = p;
      }
      if (was !== location.hash) return;
      present(shown, nav);
      pair();
      // as v asked: the view has the keys, as tab gives them
      if (p === handing) ((handing = undefined), into());
    }

    // a page is its source too: u flips the view to the other, built the
    // first time. the frame never moves, for a frame moved loads again: the
    // outline goes after it, or before it, and the one not shown is hidden
    const markup = outline('html');
    async function flip(to) {
      const shown = aside.lastChild,
        page = !!shown?.matches('iframe.page');

      ['k ↑', 'Previous', () => pane().move(-1)],
      ['l →', 'Unfold, or step in; a file opens', () => pane().right()],

        () => pane().left(),

      ['enter', 'Unfold or fold; a file opens', () => pane().toggle()],
      ['tap', 'Unfold or fold; a file opens'],
      ['.', 'Show or hide names that start with a dot', dotsOnOff],
      ['o', 'An outline: fold to its outline', () => pane().outline?.()],
      ['z', 'An outline: fold the rest', () => pane().rest?.()],
      ['e', 'An outline: expand all', () => pane().all?.()],
      ['c', 'An outline: collapse all', () => pane().none?.()],
      ['/', 'Find; in an outline, a heading', () => pane().find()],

        'The next file',
        () => aside.querySelector('[rel=next][href]')?.click(),

      [
        'p',
        'The previous file',
        () => aside.querySelector('[rel=prev][href]')?.click(),

        () => aside.querySelector('.pdf')?.classList.toggle('flip'),

      ['u', 'A page: its source, or the page again', () => flip()],
      ['v', 'The nearest changes.diff above the cursor, keys in it', changes],
