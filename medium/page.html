<!doctype html>
<!-- -- head -- -->
<!-- a page. the data is main, in content: one <details id> per node,
     nested for depth, one heading in each summary. edit that, and add
     rules at the end of style. edit nothing else.

     add    copy a <details id> block. its id is its address: page.html#id
     index  the index and the numbers are built from the nodes. never
            type either; delete a node and the rest renumber.
     map    grep -n -- '-- [a-z]* --' page.html
     check  check page.html -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>title</title>

<style>
/* -- tokens -- */
:root {
  --bg: #f1f4f3; --panel: #fbfcfb; --fg: #101719; --dim: #57686c;
  --line: #c6d1d0; --accent: #16646f;
  --mono: ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1315; --panel: #141c1e; --fg: #e3eae9; --dim: #91a2a4;
          --line: #2b383b; --accent: #5cc2c9; }
}

/* -- style -- */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 17px/1.6 Charter, Georgia, serif; }
a { color: var(--accent); }
pre, code { font-family: var(--mono); font-size: .85em; }
pre { background: var(--panel); border: 1px solid var(--line);
      padding: 12px 16px; overflow-x: auto; }
.page { display: grid; grid-template-columns: 240px minmax(0, 1fr);
        gap: 40px; max-width: 1200px; margin: auto; padding: 32px 16px; }
nav { position: sticky; top: 16px; align-self: start;
      max-height: calc(100vh - 32px); overflow: auto;
      font: 12.5px/1.5 var(--mono); }
@media (max-width: 900px) {
  .page { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; max-height: none; }
}
nav ul { list-style: none; margin: 0; padding: 0; }
nav ul ul { padding-left: 12px; border-left: 1px solid var(--line); }
nav a { color: var(--fg); text-decoration: none; }
nav button { font: inherit; margin: 0 4px 10px 0; cursor: pointer; }
.n { color: var(--dim); margin-right: 6px; }
details { border-top: 1px solid var(--line); }
summary { cursor: pointer; padding: 10px 0; }
summary > :last-child { display: inline; margin: 0;
                        font: 600 16px/1.35 var(--mono); }
details > div { padding: 0 0 18px 20px; }
p { max-width: 72ch; }
@media print { nav { display: none; } .page { display: block; } }
</style>

<!-- -- content -- -->
<div class="page">
<nav><button id="all">expand all</button><button id="none">collapse all</button></nav>
<main>

<h1>title</h1>
<p>what this is, and who it is for.</p>

<details id="what" open>
<summary><h2>what it is</h2></summary>
<div>
  <p>the idea, top-down.</p>

  <details id="example" open>
  <summary><h3>an example</h3></summary>
  <div>
    <pre>quoted from a run</pre>
  </div>
  </details>
</div>
</details>

<details id="state">
<summary><h2>where it stands</h2></summary>
<div>
  <p>done, not done, open.</p>
</div>
</details>

</main>
</div>

<script type="module">
// -- engine --
const el = (tag, props) => Object.assign(document.createElement(tag), props);
const nodes = [...document.querySelectorAll('main details[id]')];
const up = d => d.parentElement.closest('details[id]');

const index = (parent, prefix) => {
  const ul = el('ul');
  nodes.filter(d => up(d) === parent).forEach((d, i) => {
    const head = d.querySelector('summary');
    const n = el('span', {className: 'n', textContent: prefix + (i + 1)});
    const a = el('a', {href: '#' + d.id});
    a.append(n, head.textContent);
    head.prepend(n.cloneNode(true));
    const li = ul.appendChild(el('li'));
    li.append(a);
    if (nodes.some(k => up(k) === d))
      li.append(index(d, n.textContent + '.'));
  });
  return ul;
};
document.querySelector('nav').append(index(null, ''));

// every ancestor, not only nodes: a closed fold hides its target too
const reveal = t => {
  for (let d = t && t.closest('details'); d;
       d = d.parentElement.closest('details'))
    d.open = true;
};
const follow = () => {
  const t = document.getElementById(location.hash.slice(1));
  if (t) { reveal(t); t.scrollIntoView(); }
};
// a click on the hash already shown fires no hashchange
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) reveal(document.getElementById(a.hash.slice(1)));
});
addEventListener('hashchange', follow);
follow();

const every = open => () => nodes.forEach(d => d.open = open);
document.getElementById('all').onclick = every(true);
document.getElementById('none').onclick = every(false);
addEventListener('beforeprint', every(true));
</script>
