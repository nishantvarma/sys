<!doctype html>
<!-- -- head -- -->
<!-- a page. the data is main, in content: a title, a lead, then one
     <details id> per node, nested for depth. a summary holds the node's
     heading, then anything for the right edge: a count, a pill. edit that,
     and add rules under local. edit nothing else.

     add      copy a <details id> block. its id is its address: page.html#id
     lead     <div class="lead"> before the first node: what the page says,
              in one card
     fold     the open attribute is where the page opens folded
     look     from nesting alone: a top node is a card, a node holding
              nodes a card inside it, a node holding none a row
     tiles    <main class="tiles"> with each top node in a div.tile: a grid
              of tiles, a node's data-state its tint. one open is the page,
              the grid out of sight, esc or h comes back; two or more, as
              e does, open in place. ↓ ↑ go by row, → ← along it
     outline  the page is its own index: folded, the headings are the
              outline, and the box lists them. built from the nodes, never
              typed: delete a node with nothing else
     keys     j k move, ↓ ↑ too, in a grid by row, and → ← along it; else
              → l unfold or step in, ← h fold or go up and fold that, at
              the top the row before. enter go to it, / t the box: cards,
              type to find, arrows, o fold to the outline, z fold the
              rest, e expand all, c collapse all, ? the keys, esc close a
              box
     bar      at the very top, where it stays: a scroll moves only the text.
              e, c and ? as ghost icons, each named with its key in its
              title; ? shows each beside its key
              the trail beside them: the title, then each node down to the
              one being read, a link back out of each. built from the nodes
     map      grep -n -- '-- [a-z]* --' page.html
     check    check page.html; node page/run.mjs [page]... -->
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Title</title>

  <style>
    /* -- tokens -- */
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f6f4, #111413);
      --panel: light-dark(#ffffff, #181c1a);
      --fg: light-dark(#1c211f, #e3e7e4);
      --dim: light-dark(#68716d, #9aa39e);
      --line: light-dark(#e5e8e4, #262b28);
      --hit: light-dark(#fff4d6, #3a3218);
      --accent: light-dark(#2463c7, #6aa2f2);
      --plus: light-dark(#2e8653, #52b57c);
      --minus: light-dark(#c4332a, #ee665b);
      --sans: 'Ubuntu Sans', system-ui, 'Helvetica Neue', Arial, sans-serif;
      --mono: 'Ubuntu Sans Mono', ui-monospace, Menlo, Consolas, monospace;
    }

    /* -- style -- */
    * {
      box-sizing: border-box;
    }
    body {
      max-width: 70rem;
      margin: 0 auto;
      padding: 0 1rem 5rem;
      background: var(--bg);
      color: var(--fg);
      font: 0.875rem/1.55 var(--sans);
    }
    a {
      color: var(--accent);
    }
    pre,
    code {
      font-family: var(--mono);
      font-size: 0.9em;
    }
    pre {
      margin: 0.5rem 0;
      overflow-x: auto;
      line-height: 1.5;
    }
    p {
      max-width: 54rem;
      margin: 0.375rem 0;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.0625rem;
      line-height: 1.35;
    }

    /* the lead: what the page says, in one card, before the tree */
    .lead {
      margin-bottom: 1.25rem;
      padding: 0.875rem 1.125rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    .lead > p:first-child {
      font-size: 0.9375rem;
      font-weight: 500;
    }

    /* the bar: the folds of the whole page, at its very top, where it
       stays: the text scrolls under it. each tool a ghost icon, its name
       and key in its title; a tint under the pointer, none at rest */
    .bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 0.125rem;
      align-items: center;
      margin: 0 0 1.25rem;
      padding: 0.25rem 0;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    .bar button {
      display: grid;
      place-items: center;
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--dim);
      cursor: pointer;
    }
    :is(.bar, dt) svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (hover: hover) {
      .bar button:hover {
        background: color-mix(in oklab, var(--fg) 7%, transparent);
        color: var(--fg);
      }
    }
    .crumb {
      flex: 1;
      min-width: 0;
      margin: 0 0.5rem;
      overflow: hidden;
      color: var(--dim);
      font-size: 0.8125rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .crumb a {
      color: inherit;
      text-decoration: none;
    }
    .crumb b {
      color: var(--fg);
      font-weight: 600;
    }
    @media (hover: hover) {
      .crumb a:hover {
        color: var(--fg);
      }
    }
    .bar button:last-child {
      margin-left: auto;
    }
    /* a node jumped or moved to clears the bar */
    [id],
    summary {
      scroll-margin-top: 3rem;
    }

    /* the tree: a summary is the heading, then figures at the right edge */
    summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem;
      align-items: baseline;
      cursor: pointer;
    }
    /* safari's marker is a box of its own, which flex keeps */
    summary::-webkit-details-marker {
      display: none;
    }
    summary > :first-child {
      flex: 1;
      min-width: 15rem;
      margin: 0;
      font-size: inherit;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    summary:hover > :first-child {
      color: var(--accent);
    }
    .focus > summary {
      border-radius: inherit;
      background: var(--hit);
      box-shadow: inset 2px 0 var(--accent);
    }

    /* a top node: a card, or in main.tiles a tile holding one */
    main > details,
    main > .tile > details {
      margin: 0 0 0.625rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    main > details > summary,
    main > .tile > details > summary {
      padding: 0.625rem 0.75rem;
    }
    main > details > summary > :first-child,
    main > .tile > details > summary > :first-child {
      font-weight: 600;
    }
    main > details > div,
    main > .tile > details > div {
      padding: 0 0.75rem 0.625rem 1.5rem;
    }

    /* a node holding nodes, inside another: a card on the page's ground */
    details details:has(details) {
      margin: 0.5rem 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
    }
    details details:has(details) > summary {
      padding: 0.4375rem 0.75rem;
    }
    details details:has(details) > summary > :first-child {
      font-weight: 500;
    }
    details details:has(details) > div {
      padding: 0 0.75rem 0.5rem 1.5rem;
    }

    /* a node holding none: a row */
    details details:not(:has(details)) {
      border-top: 1px solid var(--line);
    }
    details > div > details:not(:has(details)):first-child {
      border-top: 0;
    }
    details details:not(:has(details)) > summary {
      margin-left: -0.25rem;
      padding: 0.3125rem 0.25rem;
    }
    details details:not(:has(details)) > summary > :first-child {
      font-weight: 400;
    }
    details details:not(:has(details)) > div {
      padding: 0 0 0.5rem 0.75rem;
    }

    /* the boxes: the outline, an input over a list; the keys, a dl */
    dialog {
      width: min(62rem, 100% - 2rem);
      margin-top: 12vh;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--fg);
      box-shadow: 0 12px 40px rgb(0 0 0 / 0.2);
    }
    /* the keys box has nothing to focus but itself */
    dialog:focus {
      outline: 0;
    }
    dialog::backdrop {
      background: rgb(0 0 0 / 0.15);
    }
    dialog input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: none;
      color: inherit;
      font: 1rem var(--sans);
      outline: 0;
    }
    /* the box: a card for each node, in a grid */
    dialog ol {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
      gap: 0.5rem;
      max-height: 60vh;
      margin: 0;
      padding: 0.5rem;
      overflow: auto;
      list-style: none;
    }
    dialog li {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--line);
      border-left: 4px solid var(--tint, var(--line));
      border-radius: 8px;
      font-size: 0.8125rem;
      line-height: 1.4;
      cursor: pointer;
    }
    dialog li h2 {
      margin: 0;
      font-size: inherit;
      font-weight: 600;
    }
    dialog li .pill {
      align-self: flex-start;
    }
    dialog li .lede {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      white-space: normal;
    }
    [aria-current='true'] {
      box-shadow: inset 2px 0 var(--accent);
    }
    [aria-selected='true'] {
      background: var(--accent);
      color: var(--panel);
    }
    [aria-selected='true'] .pill,
    [aria-selected='true'] .lede {
      color: inherit;
    }
    dialog dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.375rem 1rem;
      margin: 0;
      padding: 1rem 1.25rem;
    }
    dialog dd {
      margin: 0;
      color: var(--dim);
    }
    kbd {
      font: 0.8125rem var(--mono);
    }
    /* a key the bar holds, its icon beside it */
    dt svg {
      margin-left: 0.5rem;
      vertical-align: -0.1875rem;
    }

    @media print {
      .bar,
      summary::before {
        display: none;
      }
    }

    /* -- state -- */
    /* a node's state: data-state on its <details>, one of done now fail
       open blocked, a tint, and a pill at its right edge */
    :root {
      --done: light-dark(#16a34a, #4cc97f);
      --now: light-dark(#2563eb, #5b9bff);
      --fail: light-dark(#e11d48, #ff6b78);
      --open: light-dark(#f59e0b, #ffb534);
      --blocked: light-dark(#9333ea, #b98cf5);
    }
    .pill {
      text-transform: uppercase;
      letter-spacing: 0.04em;
      align-self: center;
      padding: 0.0625rem 0.5rem;
      border-radius: 999px;
      background: color-mix(in oklab, currentColor 12%, transparent);
      color: var(--dim);
      font: 600 0.6875rem var(--mono);
    }
    [data-state='done'] > summary > .pill {
      color: var(--done);
    }
    [data-state='now'] > summary > .pill {
      color: var(--now);
    }
    [data-state='fail'] > summary > .pill {
      color: var(--fail);
    }
    [data-state='open'] > summary > .pill {
      color: var(--open);
    }
    [data-state='blocked'] > summary > .pill {
      color: var(--blocked);
    }
    /* a done node's heading reads settled: dim, struck through. :where
       weighs nothing, so hover's accent still wins */
    :where([data-state='done']) > summary > :first-child {
      color: var(--dim);
      text-decoration: line-through;
      text-decoration-color: var(--line);
    }
    .lede {
      flex-basis: 100%;
      color: var(--dim);
      font-size: 0.8125rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    details[open] > summary > .lede {
      display: none;
    }
    [data-state='done'] {
      --tint: var(--done);
    }
    [data-state='now'] {
      --tint: var(--now);
    }
    [data-state='fail'] {
      --tint: var(--fail);
    }
    [data-state='open'] {
      --tint: var(--open);
    }
    [data-state='blocked'] {
      --tint: var(--blocked);
    }
    /* -- tiles -- */
    /* main.tiles: each top node a tile in a grid, in a div.tile. one open is
       the page, the grid out of sight, and closing it comes back; two or
       more, as e does, open in place */
    /* the tiles: a grid, each tile its state's colour. an open node floats over the grid as a card, its
       tile kept, so nothing moves */
    main.tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
      gap: 0.5rem;
    }
    main.tiles > :not(.tile) {
      grid-column: 1 / -1;
    }
    .tiles > .tile {
      height: 7rem;
    }
    main.tiles > .tile > details {
      height: 100%;
      margin: 0;
      overflow: hidden;
      border-color: transparent;
      border-radius: 1rem;
      background: color-mix(
        in oklab,
        var(--tint, transparent) 9%,
        var(--panel)
      );
      box-shadow:
        0 1px 2px rgb(0 0 0 / 0.06),
        0 6px 18px rgb(0 0 0 / 0.05);
    }
    /* one open: you go in, the grid is out of sight and the node is the
       page; closing it comes back to the grid. two or more, as e does,
       open in place */
    main.many .tile:has(> [open]),
    main:not(.many) .tile:has(> [open]) {
      height: auto;
    }
    main:not(.many):has(> .tile > [open]) {
      display: block;
    }
    main:not(.many):has(> .tile > [open]) > .tile:not(:has(> [open])) {
      display: none;
    }
    /* an entry's text is read, not run: the page's own face, wrapped */
    .tiles pre {
      max-width: 54rem;
      font: 0.9375rem/1.6 var(--sans);
      white-space: pre-wrap;
    }
    .tiles > .tile > .focus {
      outline: 0;
    }
    .tiles > .tile > .focus:not([open]) {
      box-shadow:
        0 0 0 2px var(--accent),
        0 6px 18px rgb(0 0 0 / 0.08);
    }
    .tiles > .tile > .focus > summary {
      background: none;
      box-shadow: none;
    }
    /* -- local -- */
  </style>

  <!-- -- content -- -->
  <main>
    <h1>Title</h1>
    <div class="lead">
      <p>What this is, and who it is for.</p>
    </div>

    <details id="what" open>
      <summary><h2>What it is</h2></summary>
      <div>
        <p>The idea, top-down.</p>

        <details id="example" open>
          <summary><h3>An example</h3></summary>
          <div>
            <pre>Quoted from a run</pre>
          </div>
        </details>
      </div>
    </details>

    <details id="state">
      <summary><h2>Where it stands</h2></summary>
      <div>
        <p>Done, not done, open.</p>
      </div>
    </details>
  </main>

  <script type="module">
    // -- engine --
    const el = (tag, props) =>
      Object.assign(document.createElement(tag), props);
    // a box closes on esc, as a dialog does, and on a click outside it
    const modal = innerHTML =>
      document.body.appendChild(el('dialog', { closedBy: 'any', innerHTML }));
    const toggle = dialog =>
      dialog.open ? dialog.close() : dialog.showModal();
    const main = document.querySelector('main');
    const nodes = [...main.querySelectorAll('details[id]')];
    const up = d => d.parentElement.closest('details[id]');
    const heading = d => d.querySelector(':scope > summary > :first-child');
    // in sight: no fold above it is closed
    const shown = d => !d.parentElement.closest('details:not([open])');
    let focused;

    // the keys act on one node: put there by a click, a move or a hash, and
    // taken along by a scroll that leaves it
    function focus(d) {
      if (!d) return;
      focused?.classList.remove('focus');
      focused = d;
      d.classList.add('focus');
      trail();
    }
    function show(d) {
      focus(d);
      d?.firstElementChild.scrollIntoView({ block: 'nearest' });
    }
    main.addEventListener('click', e => {
      const d = e.target.closest('summary')?.parentElement;
      if (nodes.includes(d)) focus(d);
    });

    // the node being read: the last summary above a line near the top. ask
    // the folds, not the layout: firefox boxes a summary under a closed one
    const above = d => d.firstElementChild.getBoundingClientRect().top < 90;
    const topOf = d => d.firstElementChild.getBoundingClientRect().top;
    function reading() {
      const seen = nodes.filter(shown);
      const last = seen.findLast(above);
      return seen.find(d => last && topOf(d) === topOf(last)) ?? nodes[0];
    }
    function inview(d) {
      const r = d.firstElementChild.getBoundingClientRect();
      return r.bottom > 0 && r.top < innerHeight;
    }
    addEventListener('scroll', () => {
      if (!inview(focused)) focus(reading());
    });

    // -- hash --
    // every fold around the target opens, a node's or not: a closed one
    // hides it
    function reveal(t) {
      for (const d of document.querySelectorAll('details'))
        if (d.contains(t)) d.open = true;
    }
    function follow() {
      const t = document.getElementById(location.hash.slice(1));
      if (!t) return;
      reveal(t);
      t.scrollIntoView();
      focus(t.closest('details[id]'));
    }
    // the hash already shown fires no hashchange, so going there follows it
    const go = d =>
      location.hash === '#' + d.id ? follow() : (location.hash = d.id);
    addEventListener('hashchange', follow);
    // nor does a link to it, which the browser scrolls to: open the way first
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#"]');
      if (a && !e.defaultPrevented)
        reveal(document.getElementById(a.hash.slice(1)));
    });

    // -- folds --
    // a fold of the whole page: open says which nodes stay open, and the
    // keys go up to the nearest node still in sight
    const fold = open => () => {
      for (const d of nodes) d.open = open(d);
      let d = focused;
      while (!shown(d)) d = up(d);
      show(d);
    };
    const all = fold(() => true);
    const none = fold(() => false);
    const outline = fold(d => d.matches(':has(details[id])'));
    const rest = fold(
      d => d.open && (d.contains(focused) || focused.contains(d)),
    );
    addEventListener('beforeprint', all);

    // -- box --
    // one box for where am i and where is it: empty, it is the whole outline
    // with the node being read selected; typed, the headings that match. it
    // only looks: the page's folds stay as they were until a pick. headings
    // only: the browser's own find already reaches into closed folds
    const box = modal(
      '<input placeholder="The outline · type to find a heading"' +
        ' autocomplete="off"><ol role="listbox"></ol>',
    );
    const query = box.querySelector('input');
    const results = box.querySelector('ol');
    const says = d => heading(d).textContent.toLowerCase();
    let hits = [];
    let hit = 0;

    // shown, then searched: paint scrolls the hit into sight, no further
    function find() {
      query.value = '';
      box.showModal();
      search();
    }
    function search() {
      const typed = query.value.toLowerCase().split(/\s+/).filter(Boolean);
      hits = nodes.filter(d => typed.every(w => says(d).includes(w)));
      hit = typed.length ? 0 : hits.indexOf(focused);
      paint();
    }
    // the cards sit in rows: a row is the cards level with the first
    const across = () =>
      [...results.children].filter(
        li => li.offsetTop === results.firstChild.offsetTop,
      ).length;
    function select(by) {
      hit = Math.max(0, Math.min(hits.length - 1, hit + by));
      paint();
    }
    function paint() {
      results.replaceChildren(
        ...hits.map((d, i) =>
          el('li', {
            role: 'option',
            ariaSelected: i === hit,
            ariaCurrent: d === focused,
            style: `--tint: var(--${d.dataset.state})`,
            innerHTML: d.firstElementChild.innerHTML,
          }),
        ),
      );
      results.children[hit]?.scrollIntoView({ block: 'nearest' });
    }
    function pick(d) {
      box.close();
      go(d);
    }
    query.oninput = search;
    query.onkeydown = e => {
      if (e.key === 'ArrowDown') select(across());
      else if (e.key === 'ArrowUp') select(-across());
      else if (e.key === 'ArrowRight') select(1);
      else if (e.key === 'ArrowLeft') select(-1);
      else if (e.key === 'Enter' && hits[hit]) pick(hits[hit]);
      else return;
      e.preventDefault();
    };
    results.onclick = e => {
      const i = [...results.children].indexOf(e.target.closest('li'));
      if (hits[i]) pick(hits[i]);
    };

    // -- keys --
    // in tiles, one node open is the page, the grid out of sight
    const inside = () =>
      main.matches('.tiles:not(.many):has(> .tile > [open])');
    function move(by) {
      if (inside() && !up(focused)) focused.open = false;
      const seen = nodes.filter(shown);
      const i = seen.indexOf(focused) + by;
      show(seen[Math.max(0, Math.min(seen.length - 1, i))]);
    }
    // a grid has its nodes in rows: the tops level with the first, or one
    const row = () => {
      if (inside()) return 1;
      const tops = nodes.filter(d => !up(d));
      const at = d => d.closest('main > *').getBoundingClientRect().top;
      return tops.filter(d => at(d) === at(tops[0])).length;
    };
    const right = () => (focused.open ? move(1) : (focused.open = true));
    function left() {
      if (focused.open) return (focused.open = false);
      const d = up(focused);
      if (!d) return move(-1);
      d.open = false;
      show(d);
    }

    // one table: each key is bound from it, and ? lists it
    const keys = [
      ['j', 'Next heading', () => move(1)],
      ['k', 'Previous heading', () => move(-1)],
      ['↓', 'Next heading, in a grid a row down', () => move(row())],
      ['↑', 'Previous heading, in a grid a row up', () => move(-row())],
      [
        '→',
        'In a grid the next, else l',
        () => (row() > 1 ? move(1) : right()),
      ],
      [
        '←',
        'In a grid the previous, else h',
        () => (row() > 1 ? move(-1) : left()),
      ],
      ['l', 'Unfold, or step in', right],
      ['h', 'Fold, or go up and fold that', left],
      ['enter', 'Go to it: its address in the url', () => go(focused)],
      ['/ t', 'The box: cards, type to find, arrows, enter to go', find],
      ['o', 'Outline: every node that holds nodes, open', outline],
      ['z', 'Fold the rest', rest],
      ['e', 'Expand all', all],
      ['c', 'Collapse all', none],
      ['?', 'These keys', () => toggle(help)],
      ['esc', 'Close a box, else fold', left],
    ];
    // the keys the bar holds: each one's icon, its strokes on a 16 grid
    const icons = {
      e: 'M4 6l4 4 4-4',
      c: 'M4 10l4-4 4 4',
      '?':
        'M8 1.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM6.2 6.2a1.9 1.9 0 ' +
        '1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4M8 11.6v.1',
    };
    const icon = key =>
      '<svg viewBox="0 0 16 16" aria-hidden="true">' +
      `<path d="${icons[key]}"/></svg>`;
    const help = modal(
      `<dl>${keys
        .map(
          ([names, what]) =>
            `<dt><kbd>${names}</kbd>${icons[names] ? icon(names) : ''}</dt>` +
            `<dd>${what}</dd>`,
        )
        .join('')}</dl>`,
    );
    // the bar sits at the very top: a ghost icon for each key it holds, its
    // name and key in its title
    const bar = el('div', { className: 'bar' });
    for (const [key, what, act] of keys.filter(([key]) => icons[key])) {
      const said = `${what} (${key})`;
      bar.append(
        el('button', {
          title: said,
          ariaLabel: said,
          innerHTML: icon(key),
          onclick: act,
        }),
      );
    }
    // and where the reader is, as a path from the title: each a way back
    const crumb = el('nav', { className: 'crumb' });
    bar.lastChild.before(crumb);
    const home = () => {
      main.querySelector(':scope > .tile > [open]')?.removeAttribute('open');
      scrollTo(0, 0);
    };
    function trail() {
      const path = [];
      for (let d = focused; d; d = up(d)) path.unshift(d);
      crumb.replaceChildren(
        el('a', {
          href: '#',
          textContent: main.querySelector('h1').textContent,
          onclick: e => (e.preventDefault(), home()),
        }),
        ...path.flatMap((d, i) => [
          ' › ',
          i < path.length - 1
            ? el('a', {
                href: '#' + d.id,
                textContent: heading(d).textContent,
              })
            : el('b', { textContent: heading(d).textContent }),
        ]),
      );
    }
    document.body.prepend(bar);
    const bound = Object.fromEntries(
      keys.flatMap(([names, , act]) => names.split(' ').map(k => [k, act])),
    );
    // e.key, as the table spells it
    const spelt = {
      ArrowDown: '↓',
      ArrowUp: '↑',
      ArrowRight: '→',
      ArrowLeft: '←',
      Enter: 'enter',
      Escape: 'esc',
    };

    // a page's own key handler wins where it prevents the default. a field
    // keeps its letters, and an open box its keys, but for ? closing its own
    addEventListener('keydown', e => {
      if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.closest('input, select, textarea')) return;
      if (box.open || (help.open && e.key !== '?')) return;
      const act = bound[spelt[e.key] ?? e.key];
      if (!act) return;
      e.preventDefault();
      act();
    });

    // one node open is the page, two or more open in place
    new MutationObserver(() =>
      main.classList.toggle(
        'many',
        main.querySelectorAll(':scope > .tile > [open]').length > 1,
      ),
    ).observe(main, {
      attributes: true,
      attributeFilter: ['open'],
      subtree: true,
    });

    // -- start --
    // a page opened at a hash starts there, else at what is read
    follow();
    if (!focused) focus(reading());
  </script>
</html>
